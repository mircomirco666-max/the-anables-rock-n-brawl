<style>
  /* Layout: schermo di gioco centrato come un cabinato; comandi touch sovrapposti (orizzontale) o sotto (verticale) */
  :root {
    --bg: #07040d; --panel: #140a24; --line: #2a1a40; --acc: #ffd23e; --pink: #ff4d6d; --cyan: #3ec5ff; --fg: #f4f2ea; --dim: #8a7aa8;
    --font-ui: "Arial Black", "Helvetica Neue", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0; box-sizing: border-box; display: flex; flex-direction: column; font-family: var(--font-ui);
  }
  #stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; padding-block: 8px; box-sizing: border-box; }
  #screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; box-shadow: 0 0 0 2px var(--line), 0 0 48px rgba(255, 77, 109, 0.22); }
  #screen:focus-visible { outline: 2px solid var(--acc); outline-offset: 4px; }
  #touch { display: none; }
  body.has-touch #touch { display: block; position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  #stickzone { position: absolute; left: 0; bottom: 0; width: 46%; height: 62%; pointer-events: auto; touch-action: none; }
  #stick { position: absolute; left: 22%; top: 62%; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; border: 2px solid rgba(244, 242, 234, 0.28); background: rgba(20, 10, 36, 0.35); opacity: 0.55; transition: opacity 0.12s; }
  #stick.on { opacity: 1; }
  #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%; background: rgba(255, 77, 109, 0.75); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.3); transform: translate(-50%, -50%); }
  #btns { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: 196px; height: 150px; pointer-events: none; }
  .b { position: absolute; width: 74px; height: 74px; border-radius: 50%; border: 0; color: #0a0610; font: 900 11px/1 var(--font-ui); letter-spacing: 0.06em; pointer-events: auto; touch-action: none; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.32), 0 0 0 2px rgba(0, 0, 0, 0.35); opacity: 0.82; }
  .b.on { transform: scale(0.92); opacity: 1; filter: brightness(1.2); }
  .b-atk { left: 0; bottom: 0; background: var(--pink); }
  .b-jump { right: 0; bottom: 0; background: var(--acc); }
  .b-heavy { left: 26px; top: 0; width: 60px; height: 60px; background: #ff9b45; }
  .b-spec { right: 26px; top: 0; width: 60px; height: 60px; background: var(--cyan); }
  #pausebtn { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: max(10px, env(safe-area-inset-top, 0px)); width: 44px; height: 44px; background: rgba(244, 242, 234, 0.85); font-size: 13px; }
  /* telefono in verticale: gioco in alto, comandi sotto */
  body.has-touch:not(.portrait) .b:not(.on) { opacity: 0.62; }
  body.has-touch.portrait #stage { flex: 0 0 auto; }
  body.has-touch.portrait #touch { position: relative; inset: auto; flex: 1 1 auto; }
  body.has-touch.portrait #stickzone { width: 50%; height: 100%; }
  body.has-touch.portrait #stick { top: 50%; left: 40%; }
  body.has-touch.portrait #btns { bottom: 50%; transform: translateY(50%); }
  body.has-touch.portrait #pausebtn { top: 8px; }
  @media (prefers-reduced-motion: reduce) { #stick { transition: none; } }

<script>
'use strict';
// ============================================================
// THE ANABLES: ROCK 'N' BRAWL — configurazione e parametri
// Tutti i valori di gameplay sono qui, per bilanciare in un punto solo.
// Fonti dei valori di partenza: report di ricerca (hit-stop Final Fight /
// The Punisher misurati; il resto sono stime da calibrare con il playtest).
// ============================================================


const W = 384, H = 224;            // risoluzione logica del CP System (384x224)
const K = 1.6;                      // scala del mondo rispetto alla prima versione
const RS = 2;                       // pixel fini per unità del mondo (risoluzione interna 768x448)
const STEP_MS = 1000 / 60;          // update fisso a 60 Hz
const MAX_FRAME_MS = 250;           // limite anti "spirale della morte"

// Corsie: z = coordinata y dei piedi sullo schermo
const LANE_TOP = 140, LANE_BOTTOM = 216;

const TUNE = {
  gravity: 0.45,
  jumpV: 7.2,            // ~58 px di salto
  zTol: 11,              // tolleranza profondità colpi
  zTolGrab: 15,          // prese e speciali
  bufferFrames: 8,       // input buffer
  hsLight: 6,            // hit-stop colpo leggero (Final Fight)
  hsHeavy: 8,
  hsFinA: 9,             // finisher: attaccante
  hsFinV: 11,            // finisher: colpito (The Punisher)
  hsCap: 12,             // tetto massimo
  getupInv: 60,          // invincibilità al rialzo
  respawnInv: 150,
  maxAttackersPerPlayer: 2,
  doubleTap: 14,
  comboWindow: 40,       // frame per tenere viva la combo
  grabHold: 96,
  shakeSmall: 2, shakeBig: 3,
};

// Colori chiave dei giocatori (indicatori, cursori, HUD)
const PCOL = ['#ff4d6d', '#3ec5ff', '#ffd23e', '#62f08e', '#c58bff', '#ff9b45'];
const MAX_PLAYERS = 4;   // Chrome espone max 4 gamepad; architettura pronta per 6

const DIFFS = [
  { id: 'facile', name: 'FACILE', enemyDmg: 0.7, enemyHp: 0.85, aggro: 0.8 },
  { id: 'normale', name: 'NORMALE', enemyDmg: 1.0, enemyHp: 1.0, aggro: 1.0 },
  { id: 'difficile', name: 'DIFFICILE', enemyDmg: 1.35, enemyHp: 1.2, aggro: 1.25 },
];
// ============================================================
// Utilità: matematica, colori, rasterizzatore pixel-perfect
// ============================================================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const chance = p => Math.random() < p;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const DEG = Math.PI / 180;

// Colore esadecimale -> Uint32 little-endian per ImageData
const _colCache = new Map();
function col(hex, alpha = 255) {
  const key = hex + alpha;
  let c = _colCache.get(key);
  if (c !== undefined) return c;
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  c = ((alpha << 24) | (b << 16) | (g << 8) | r) >>> 0;
  _colCache.set(key, c);
  return c;
}
function shade(hex, f) { // f<1 scurisce, f>1 schiarisce
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const ch = i => clamp(Math.round(parseInt(h.slice(i, i + 2), 16) * f), 0, 255).toString(16).padStart(2, '0');
  return '#' + ch(0) + ch(2) + ch(4);
}
function mix(h1, h2, t) {
  const p = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
  const a = p(h1), b = p(h2);
  return '#' + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, '0')).join('');
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  return [c, ctx];
}

// ---------- Rasterizzatore su buffer: niente antialiasing, pixel netti ----------
// Le coordinate dei metodi sono nelle unità del mondo; il buffer interno ha "s" pixel
// fini per unità (s = RS = 2 per gli sprite): le forme geometriche vengono campionate
// alla risoluzione fine, così contorni e curve diventano più dettagliati.
class PixBuf {
  constructor(w, h, s = 1) { this.s = s; this.w = w; this.h = h; this.W = Math.max(1, Math.ceil(w * s)); this.H = Math.max(1, Math.ceil(h * s)); this.d = new Uint32Array(this.W * this.H); }
  static hi(W, H, s) { const p = new PixBuf(W / s, H / s, s); if (p.W !== W || p.H !== H) { p.W = W; p.H = H; p.d = new Uint32Array(W * H); } return p; }
  setHi(X, Y, c) {
    if (X < 0 || Y < 0 || X >= this.W || Y >= this.H || !c) return;
    this.d[Y * this.W + X] = c;
  }
  getHi(X, Y) { if (X < 0 || Y < 0 || X >= this.W || Y >= this.H) return 0; return this.d[Y * this.W + X]; }
  // pixel "grosso" (un'unità del mondo)
  set(x, y, c) {
    const s = this.s;
    if (s === 1) { x = Math.floor(x); y = Math.floor(y); if (x < 0 || y < 0 || x >= this.W || y >= this.H || !c) return; this.d[y * this.W + x] = c; return; }
    const X0 = Math.floor(x * s), Y0 = Math.floor(y * s);
    for (let j = 0; j < s; j++) for (let i = 0; i < s; i++) this.setHi(X0 + i, Y0 + j, c);
  }
  // punto fine (un pixel ad alta risoluzione)
  dot(x, y, c) { this.setHi(Math.floor(x * this.s), Math.floor(y * this.s), c); }
  get(x, y) { return this.getHi(Math.floor(x * this.s), Math.floor(y * this.s)); }
  rect(x, y, w, h, c) {
    const s = this.s, X0 = Math.floor(Math.floor(x) * s), Y0 = Math.floor(Math.floor(y) * s), X1 = X0 + Math.round(w * s), Y1 = Y0 + Math.round(h * s);
    for (let Y = Y0; Y < Y1; Y++) for (let X = X0; X < X1; X++) this.setHi(X, Y, c);
  }
  // rettangolo con coordinate libere (anche mezze unità)
  rectF(x, y, w, h, c) {
    const s = this.s, X0 = Math.round(x * s), Y0 = Math.round(y * s), X1 = Math.round((x + w) * s), Y1 = Math.round((y + h) * s);
    for (let Y = Y0; Y < Y1; Y++) for (let X = X0; X < X1; X++) this.setHi(X, Y, c);
  }
  disc(cx, cy, r, c) {
    const s = this.s, rr = r * r + r * 0.6, ox = Math.floor(cx) + 0.5, oy = Math.floor(cy) + 0.5;
    const X0 = Math.floor((ox - r - 1.5) * s), X1 = Math.ceil((ox + r + 1.5) * s), Y0 = Math.floor((oy - r - 1.5) * s), Y1 = Math.ceil((oy + r + 1.5) * s);
    for (let Y = Y0; Y < Y1; Y++) { const dy = (Y + 0.5) / s - oy; for (let X = X0; X < X1; X++) { const dx = (X + 0.5) / s - ox; if (dx * dx + dy * dy <= rr) this.setHi(X, Y, c); } }
  }
  ellipse(cx, cy, rx, ry, c) {
    const s = this.s, ox = Math.floor(cx) + 0.5, oy = Math.floor(cy) + 0.5, ax = rx * rx + 0.3, ay = ry * ry + 0.3;
    const X0 = Math.floor((ox - rx - 1.5) * s), X1 = Math.ceil((ox + rx + 1.5) * s), Y0 = Math.floor((oy - ry - 1.5) * s), Y1 = Math.ceil((oy + ry + 1.5) * s);
    for (let Y = Y0; Y < Y1; Y++) { const dy = (Y + 0.5) / s - oy; for (let X = X0; X < X1; X++) { const dx = (X + 0.5) / s - ox; if (dx * dx / ax + dy * dy / ay <= 1) this.setHi(X, Y, c); } }
  }
  stampHi(X, Y, w, c) {
    const o = Math.floor((w - 1) / 2);
    for (let j = 0; j < w; j++) for (let i = 0; i < w; i++) {
      if (w >= 4 && (i === 0 || i === w - 1) && (j === 0 || j === w - 1)) continue;
      this.setHi(X - o + i, Y - o + j, c);
    }
  }
  stamp(x, y, w, c) { const s = this.s; this.stampHi(Math.floor(x * s) + (s >> 1), Math.floor(y * s) + (s >> 1), Math.max(1, Math.round(w * s)), c); }
  line(x0, y0, x1, y1, c, w = 1) {
    const s = this.s, sw = Math.max(1, Math.round(w * s));
    let X0 = Math.round(x0 * s + (s >> 1)), Y0 = Math.round(y0 * s + (s >> 1)); const X1 = Math.round(x1 * s + (s >> 1)), Y1 = Math.round(y1 * s + (s >> 1));
    const dx = Math.abs(X1 - X0), dy = -Math.abs(Y1 - Y0);
    const sx = X0 < X1 ? 1 : -1, sy = Y0 < Y1 ? 1 : -1;
    let err = dx + dy;
    for (let guard = 0; guard < 2400; guard++) {
      this.stampHi(X0, Y0, sw, c);
      if (X0 === X1 && Y0 === Y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; X0 += sx; }
      if (e2 <= dx) { err += dx; Y0 += sy; }
    }
  }
  // Forma ruotata definita da una funzione locale (u lungo l'asse, v perpendicolare).
  // fn riceve u, v nelle unità del mondo, quantizzate al passo del pixel fine (1/s).
  shape(cx, cy, ang, u0, u1, v0, v1, fn) {
    const s = this.s, c = Math.cos(ang), sn = Math.sin(ang);
    const pts = [[u0, v0], [u1, v0], [u0, v1], [u1, v1]].map(([u, v]) => [cx + u * c - v * sn, cy + u * sn + v * c]);
    const minX = Math.floor((Math.min(...pts.map(p => p[0])) - 1) * s), maxX = Math.ceil((Math.max(...pts.map(p => p[0])) + 1) * s);
    const minY = Math.floor((Math.min(...pts.map(p => p[1])) - 1) * s), maxY = Math.ceil((Math.max(...pts.map(p => p[1])) + 1) * s);
    for (let Y = minY; Y <= maxY; Y++) for (let X = minX; X <= maxX; X++) {
      const dx = (X + 0.5) / s - cx, dy = (Y + 0.5) / s - cy;
      const u = dx * c + dy * sn, v = -dx * sn + dy * c;
      if (u < u0 || u >= u1 || v < v0 || v >= v1) continue;
      const cc = fn(Math.floor(u * s) / s, Math.floor(v * s) / s);
      if (cc) this.setHi(X, Y, cc);
    }
  }
  // Riempie un rettangolo chiedendo il colore di ogni pixel fine: fn(u, v) con u, v locali in unità del mondo
  fill(x, y, w, h, fn) {
    const s = this.s, X0 = Math.round(x * s), Y0 = Math.round(y * s), WW = Math.round(w * s), HH = Math.round(h * s);
    for (let j = 0; j < HH; j++) for (let i = 0; i < WW; i++) { const c = fn(i / s, j / s); if (c) this.setHi(X0 + i, Y0 + j, c); }
  }
  // Mappa di caratteri -> pixel (con flip orizzontale opzionale)
  blit(map, pal, x, y, flip = false) {
    for (let j = 0; j < map.length; j++) {
      const row = map[j];
      for (let i = 0; i < row.length; i++) {
        const ch = row[i];
        if (ch === '.' || ch === ' ') continue;
        const c = pal[ch];
        if (c) this.set(flip ? x + row.length - 1 - i : x + i, y + j, c);
      }
    }
  }
  // copia un altro buffer (stessa scala) con offset in pixel fini
  blitBuf(src, X0, Y0) { for (let Y = 0; Y < src.H; Y++) for (let X = 0; X < src.W; X++) { const c = src.d[Y * src.W + X]; if (c) this.setHi(X0 + X, Y0 + Y, c); } }
  // Contorno scuro di 1 pixel fine attorno alla sagoma
  outline(c) {
    const w = this.W, h = this.H, d = this.d;
    const src = d.slice();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (src[y * w + x]) continue;
      if ((x > 0 && src[y * w + x - 1]) || (x < w - 1 && src[y * w + x + 1]) ||
        (y > 0 && src[(y - 1) * w + x]) || (y < h - 1 && src[(y + 1) * w + x])) d[y * w + x] = c;
    }
  }
  // Contorno selettivo (stile CPS): ogni bordo prende una versione scura del colore vicino
  outlineSel(base = '#0d0a12', k = 0.58) {
    const w = this.W, h = this.H, d = this.d;
    const src = d.slice();
    const br = (base.replace('#', '').match(/../g) || ['0d', '0a', '12']).map(v => parseInt(v, 16));
    const cache = new Map();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (src[y * w + x]) continue;
      let n = 0;
      if (y < h - 1 && src[(y + 1) * w + x]) n = src[(y + 1) * w + x];
      else if (x > 0 && src[y * w + x - 1]) n = src[y * w + x - 1];
      else if (x < w - 1 && src[y * w + x + 1]) n = src[y * w + x + 1];
      else if (y > 0 && src[(y - 1) * w + x]) n = src[(y - 1) * w + x];
      if (!n) continue;
      let c = cache.get(n);
      if (c === undefined) {
        const r = n & 255, g = (n >> 8) & 255, b = (n >> 16) & 255;
        const R = Math.round(r * (1 - k) * 0.55 + br[0] * k), Gg = Math.round(g * (1 - k) * 0.55 + br[1] * k), B = Math.round(b * (1 - k) * 0.55 + br[2] * k);
        c = ((255 << 24) | (B << 16) | (Gg << 8) | R) >>> 0;
        cache.set(n, c);
      }
      d[y * w + x] = c;
    }
  }
  bbox() {
    const w = this.W, h = this.H, d = this.d; let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) { const row = y * w; for (let x = 0; x < w; x++) if (d[row + x]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } }
    return x1 < 0 ? null : { x0, y0, x1, y1 };
  }
  // ritaglio in pixel fini
  crop(b) {
    const out = PixBuf.hi(b.x1 - b.x0 + 1, b.y1 - b.y0 + 1, this.s);
    for (let y = 0; y < out.H; y++) out.d.set(this.d.subarray((y + b.y0) * this.W + b.x0, (y + b.y0) * this.W + b.x0 + out.W), y * out.W);
    return out;
  }
  silhouette(c) { for (let i = 0; i < this.d.length; i++) if (this.d[i]) this.d[i] = c; }
  toCanvas() {
    const [cv, ctx] = makeCanvas(this.W, this.H);
    const img = new ImageData(new Uint8ClampedArray(this.d.buffer.slice(0)), this.W, this.H);
    ctx.putImageData(img, 0, 0);
    return cv;
  }
}
// Disegna una tela ad alta risoluzione nelle coordinate del mondo (1 unità = RS pixel fini)
function blitHi(ctx, cv, x, y, flip = false) {
  const w = cv.width / RS, h = cv.height / RS;
  x = Math.round(x * RS) / RS; y = Math.round(y * RS) / RS;
  if (flip) { ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(cv, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(cv, x, y, w, h);
}

// Palette da oggetto {chiave: '#hex'} a {chiave: u32}
function palU32(p) { const o = {}; for (const k in p) o[k] = p[k] ? col(p[k]) : 0; return o; }

// Archiviazione sicura (localStorage può fallire in modalità privata o anteprima)
const Store = {
  key: 'anables_rnb_v1',
  load() {
    try { const s = localStorage.getItem(this.key); if (s) { const o = JSON.parse(s); if (o && o.version === 1) return o; } } catch (e) { }
    return { version: 1, scores: [], options: {} };
  },
  save(o) { try { localStorage.setItem(this.key, JSON.stringify(o)); } catch (e) { } },
};
// ============================================================
// Font bitmap 5x7 originale, con cache per colore
// ============================================================
const GLYPHS = {
  'A': ['.###.', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
  'B': ['####.', '#...#', '#...#', '####.', '#...#', '#...#', '####.'],

  led(uu, vv, tw, to, du, vo, cos, seed) { const h = _hash(Math.floor(uu * 0.7), Math.floor(vv * 0.7) + seed * 13); return h < 0.12 ? C(['#3ae0ff', '#ff4fa0', '#62f08e', '#ffd34a'][Math.floor(h * 33) % 4]) : 0; },
  speaker(uu, vv, tw, to, du) { const d = Math.hypot(du + 1, vv - 14); if (d < 7) return C(d < 2 ? '#4a4a58' : d < 2.6 ? '#18161e' : d < 6.2 ? ((Math.floor(d * 2) % 2) ? '#2a2a34' : '#22222a') : '#c9cdd6'); return 0; },
  vest(uu, vv, tw, to, du, vo, cos, seed, s) { if (Math.abs(du) < 3.4 && vv > 0.5) { if (Math.abs(du) < 0.4) return C('#cfd4dd'); return shadeBand(tones(cos.shirt || '#efe3c4'), s + 0.2); } if (vv > to - 4 && Math.floor(uu * 2) % 2 === 0) return C(shade(cos.j, 0.6)); return 0; },
  sash(uu, vv, tw, to, du) { return Math.abs((uu - vv * 0.45) - 2) < 1.6 ? C(vv % 6 < 3 ? '#c42032' : '#9a1424') : 0; },
  ribs: () => 0,
};
function drawFigure(pb, look, pose, costumeKey, seed = 0) {
  const cos = COSTUMES[costumeKey] || look.costume || COSTUMES.rossa;
  const b = look.build || { h: 1, w: 1 };
  const bh = b.h * FIG_SCALE;
  const thigh = BODY.thigh * bh, shin = BODY.shin * bh, torso = BODY.torso * bh, upArm = BODY.upArm * bh, foreArm = BODY.foreArm * bh;
  const W_ = b.w * FIG_SCALE;
  // atlante fotografico ("digitalizzato"): le parti vestono la marionetta
  let TX = look.tex && Atlas.has(look.tex) ? Atlas.costumed(look.tex, costumeKey) : null;
  if (TX && look.texMode === 'evil') TX = Atlas.evil(TX);
  const S_ = (n, back) => { if (!TX) return null; const p = Atlas.part(TX, n); if (!p) return null; return back ? Object.assign(Object.create(p), { dim: 0.72 }) : p; };
  const SKIN = tones(look.skin || (TX && Atlas.skin(TX)) || '#e9b38c');
  const TR = tones(look.trousers || TROUSERS);
  const JK = tones(cos.j);
  const SH = tones(cos.shirt || '#f1efe8');
  const ox = FOOT_X, oy = FOOT_Y;

  const legPts = (leg, hx, hy) => {
    const [kx, ky] = limbEnd(hx, hy, thigh, leg[0]);
    const [fx, fy] = limbEnd(kx, ky, shin, leg[0] - leg[1]);
    return { kx, ky, fx, fy };
  };
  let hipX = ox + pose.hip[0], hipY;
  if (pose.air || pose.lie) hipY = oy - (pose.lie ? 7 : 50 * b.h) + pose.hip[1];
  else {
    const a = legPts(pose.legF, 0, 0), c2 = legPts(pose.legB, 0, 0);
    hipY = oy - 2 - Math.max(a.fy, c2.fy) + pose.hip[1];
  }
  const L = pose.lean * DEG;
  const ux = Math.cos(L), uy = Math.sin(L), vx = -Math.sin(L), vy = Math.cos(L);
  const shX = hipX - vx * torso, shY = hipY - vy * torso;
  const P2 = (u, v) => [shX + ux * u + vx * v, shY + uy * u + vy * v];

  // ---- gambe e scarpe ----
  const drawShoe = (fx, fy, sa, back) => {
    const shoe = look.shoes || 'black';
    const sp = S_('shoe', back);
    if (sp) {
      const s = pb.s, dim = back ? 0.72 : 1;
      pb.shape(fx, fy, -sa, -5, 11, -9, 2, (u, v) => { const c = sp.px(Math.floor((u + 4.5) * s), Math.floor(sp.bottom + (v - 1.5) * s)); return c ? tint32(c, dim) : 0; });
      return;
    }
    pb.shape(fx, fy, -sa, -5, 11, -4, 4, (u, v) => {
      if (v < -3 || v > 2) return 0;
      if (u > 8 && v < -1) return 0;
      if (u > 9 && v < 0) return 0;
      if (u < -3 && v < -2) return 0;
      let c;
      const top = v <= -2;
      if (shoe === 'twotone') c = (u >= 4 && v < 2) ? (top ? '#ffffff' : '#e4e2da') : (top ? '#3a3a44' : '#16161c');
      else if (shoe === 'sneaker') c = v >= 1 ? '#f0f0ea' : (top ? '#4a5068' : '#2b2f3e');
      else if (shoe === 'skate') c = v >= 1 ? '#e6e6e6' : (top ? shade(look.skateCol || '#e23b8a', 1.2) : (look.skateCol || '#e23b8a'));
      else if (shoe === 'platform') c = v >= 1 ? '#ffe27c' : (top ? '#e04aa8' : '#b8318a');
      else if (shoe === 'boot') { const bc = look.boots || '#6a3a1a'; c = v >= 1 && u < -1 ? '#18161e' : (top ? shade(bc, 1.25) : bc); if (u > 6 && v < 0) c = shade(bc, 0.8); }
      else if (shoe === 'bone') c = top ? '#efe9dc' : '#c6bfae';
      else c = top ? '#3a3a44' : '#16161c';
      if (v === 2) c = shoe === 'sneaker' ? '#d4d4cc' : '#0c0c10';
      if (shoe === 'black' && look.tassel && u === 5 && v === -2) c = '#b88a44';
      if (back) c = shade(c, 0.72);
      return C(c);
    });
    if (shoe === 'skate') { const k = back ? '#a8901e' : '#ffd34a'; pb.disc(fx - 2 + Math.sin(sa) * 4, fy + 4, 1.6, C(k)); pb.disc(fx + 6 + Math.sin(sa) * 4, fy + 4 - Math.sin(sa) * 6, 1.6, C(k)); }
    if (shoe === 'platform') pb.shape(fx, fy, -sa, -4, 10, 2, 6, (u, v) => C(v < 4 ? '#ffe27c' : '#c99a1e'));
  };
  const drawLeg = (leg, back) => {
    const [hx, hy] = [hipX + ux * (back ? -3 : 3), hipY + uy * (back ? -3 : 3)];
    const { kx, ky, fx, fy } = legPts(leg, hx, hy);
    const T = back ? { L: TR.M, M: TR.S, S: TR.D, D: TR.D } : TR;
    drawLimb(pb, hx, hy, kx, ky, 12 * W_, 10 * W_, T, back ? -0.2 : 0, !back && !TX, S_('thigh', back));
    drawLimb(pb, kx, ky, fx, fy, 10 * W_, 8, T, back ? -0.2 : 0, !back && !TX, S_('shin', back));
    if (look.boots && !TX) { const BT = tones(look.boots), bt = back ? { L: BT.M, M: BT.S, S: BT.D, D: BT.D } : BT; drawLimb(pb, kx + (fx - kx) * 0.45, ky + (fy - ky) * 0.45, fx, fy, 10.5 * W_, 9, bt, back ? -0.2 : 0, false); }
    if (look.socks && !back) { pb.set(fx - 1, fy - 1, C(look.socks)); pb.set(fx, fy - 1, C('#a8a8b0')); }
    drawShoe(fx, fy, (leg[0] - leg[1]) * DEG, back);
  };

  // ---- braccia ----
  const handAt = {};
  const armGeo = (arm, back) => {
    const [sx, sy] = P2(back ? -3 : 2, 3);
    const [ex, ey] = limbEnd(sx, sy, upArm, arm[0]);
    const [hx, hy] = limbEnd(ex, ey, foreArm, arm[0] + arm[1]);
    handAt[back ? 'B' : 'F'] = [hx, hy];
    return { sx, sy, ex, ey, hx, hy, arm };
  };
  const geoB = armGeo(pose.armB, true), geoF = armGeo(pose.armF, false);
  const drawArm = (g, back) => {
    const { sx, sy, ex, ey, hx, hy, arm } = g;
    const dim = T => back ? { L: T.M, M: T.S, S: T.D, D: T.D } : T;
    const sk = dim(SKIN), jk = dim(JK);
    const fAng = (arm[0] + arm[1]) * DEG;
    const fdx = Math.sin(fAng), fdy = Math.cos(fAng);
    if (TX) {
      drawLimb(pb, sx, sy, ex, ey, 10 * W_, 8.5, jk, 0, false, S_('upArm', back));
      drawLimb(pb, ex, ey, hx - fdx * 2.5, hy - fdy * 2.5, 8.5, 7, jk, 0, false, S_('foreArm', back));
    } else if ((cos.kind === 'shirt' || cos.kind === 'tee') && look.shortSleeve !== false) {
      const [mx, my] = limbEnd(sx, sy, upArm * 0.62, arm[0]);
      drawLimb(pb, mx, my, ex, ey, 6.5, 6, sk);
      drawLimb(pb, ex, ey, hx - fdx * 2, hy - fdy * 2, 6, 5, sk);
      drawLimb(pb, sx, sy, mx, my, 9 * W_, 8.5, cos.sleeve ? dim(tones(cos.sleeve)) : jk);
    } else {
      drawLimb(pb, sx, sy, ex, ey, 10 * W_, 8.5, jk);
      drawLimb(pb, ex, ey, hx - fdx * 3, hy - fdy * 3, 8.5, 7.5, jk);
      if (cos.kind === 'jacket') { const c = dim(SH); drawLimb(pb, hx - fdx * 3, hy - fdy * 3, hx - fdx * 1.5, hy - fdy * 1.5, 6, 6, c); }
    }
    const glove = look.glove ? dim(tones(look.glove)) : sk;
    drawFist(pb, hx, hy, Math.atan2(fdy, fdx), glove);
  };

  // ---- busto ----
  const drawTorso = () => {
    const tw = 11.5 * W_, uc = tw * 0.3;
    const tp = S_('torso');
    const hem = tp ? (look.hem ?? 8) : cos.kind === 'jacket' ? (cos.long ? 16 : 3) : 0;
    const belly = look.belly || 0;   // pancia: la sagoma si allarga a metà busto
    pb.shape(shX, shY, L, -tw - 1 - belly, tw + 1 + belly, -3, torso + hem + 1, (u, v) => {
      const uu = u + 0.5, vv = v + 0.5;
      // sagoma: spalle arrotondate, vita stretta
      let half = tw;
      if (vv < 4) half = tw - (4 - vv) * 1.1;
      else if (cos.long && vv > torso) half = tw - torso * 0.45 * 0.12 * 0.4 + (vv - torso) * 0.3;
      else if (vv > torso * 0.55) half = tw - (vv - torso * 0.55) * 0.12 * (cos.kind === 'jacket' ? 0.4 : 1);
      if (belly && vv > 6) half += belly * Math.sin(Math.PI * clamp((vv - 6) / (torso + hem - 6), 0, 1)) ** 1.3;
      if (Math.abs(uu - 0.3) > half) return 0;
      if (vv < -2) return 0;
      if (look.body) return look.body(u, v, tw, torso, cos, seed);
      // luce: davanti e in alto
      const s = (uu / tw) * 0.75 - (vv / torso) * 0.25 + 0.05;
      if (tp) {
        const hh = Math.max(half, 1);
        const i = Math.min(tp.w - 1, Math.max(0, Math.floor(((uu - 0.3) / hh * 0.5 + 0.5) * tp.w))), j = Math.min(tp.h - 1, Math.max(0, Math.floor(vv / (torso + hem) * tp.h)));
        const c = tp.px(i, j); return c ? tint32(c, 1 + s * 0.15) : 0;
      }
      if (cos.kind === 'tee') {
        // maglietta / camicia semplice dei nemici: girocollo, cintura, eventuale motivo
        const du = uu - uc;
        if (vv > torso - 2) return C(Math.abs(du) < 1.5 ? '#cfd4dd' : (vv > torso - 1 ? '#0c0c10' : (cos.belt || '#18161e')));
        if (vv < 2.4 && Math.abs(du) < 3.4 - vv * 0.7) return vv < 1.4 ? SKIN.M : JK.D;
        let c = shadeBand(JK, s);
        if (cos.sparkle) { const h = _hash(Math.round(uu * 2) + seed * 7, Math.round(vv) + seed * 3); if (h < 0.09) c = C('#fff6c8'); else if (h < 0.2) c = JK.L; }
        if (cos.pat) { const r = TORSO_PAT[cos.pat](uu, vv, tw, torso, du, 0, cos, seed, s, look); if (r) c = r; }
        return c;
      }
      if (cos.kind === 'shirt') {
        if (vv > torso - 2) return C(Math.abs(uu - uc) < 1.5 ? '#cfd4dd' : (vv > torso - 1 ? '#0c0c10' : cos.belt));
        const yokeEdge = 9 - Math.max(0, 3 - Math.abs(uu - uc) * 0.9) * -1 + (Math.abs(uu - uc) < 3 ? 3 - Math.abs(uu - uc) : 0);
        if (Math.abs(uu - uc) < 0.6 && vv > 1) return C(Math.round(vv) % 5 === 0 ? cos.btn : '#2c818c');
        if (vv < yokeEdge) {
          if (vv > yokeEdge - 1) return C(cos.pipe);
          // stampa: razzo e pianeta
          if (uu > uc + 1.5 && uu < uc + 6.5 && vv > 3 && vv < 5.2) return C(uu > uc + 5.5 ? '#ffffff' : cos.rocket);
          if (uu > uc + 0.5 && uu < uc + 1.6 && vv > 3.4 && vv < 4.8) return C('#ffd34a');
          if (Math.hypot(uu - (-4), vv - 4.2) < 1.7) return C(cos.planet);
          if (vv > 3.8 && vv < 4.6 && uu > -6.8 && uu < -1.4) return C('#8a5ad0');
          if ((Math.round(uu * 3 + vv * 7) % 23 === 0)) return C('#ffffff');
          const Y = tones(cos.yoke || cos.j); return shadeBand(Y, s);
        }
        let c = shadeBand(JK, s);
        if (cos.pat) { const r = TORSO_PAT[cos.pat](uu, vv, tw, torso, uu - uc, 0, cos, seed, s, look); if (r) c = r; }
        return c;
      }
      // giacca: apertura a V con camicia e cravatta, revers neri
      const vOpen = vv < 17 ? (1 - vv / 17) * 4.2 + 0.4 : 0;
      const du = uu - uc;
      if (vOpen > 0 && Math.abs(du) < vOpen) {
        if (cos.pat === 'ribs') return C((Math.floor(vv * 2) % 3 === 0 && Math.abs(du) < vOpen - 0.4) ? '#efe9dc' : (Math.abs(du) < 0.5 ? '#c6bfae' : '#1a1418'));
        if (look.tie === 'none') return shadeBand(SH, s + 0.2);
        if (look.tie === 'bolo') { if (Math.abs(du) < 0.6 && vv > 2) return C(vv > 4 && vv < 6 ? '#cfd4dd' : '#18161e'); }
        else if (look.tie === 'check') { if (Math.abs(du) < 1.1 && vv > 1) return C(((Math.round(vv) + (du > 0 ? 1 : 0)) % 2) ? '#f4f2ea' : '#18161e'); }
        else if (Math.abs(du) < (vv < 3 ? 1.4 : 0.95) && vv > 0.5) return C(du < -0.3 ? '#3a3a44' : cos.tie);
        return shadeBand(SH, s + 0.2);
      }
      if (vOpen > 0 && Math.abs(du) < vOpen + 2.2) return C(Math.abs(du) < vOpen + 0.8 ? '#4a4a58' : cos.lap); // revers in raso
      if (vv > 16.5 && vv < 18.5 && Math.abs(du) < 1.2) return C('#18161e');                         // bottone
      if (cos.flap && vv > 21 && vv < 22.6 && uu > -5 && uu < 2) return C(cos.flap);                  // tasca
      let c = shadeBand(JK, s);
      if (vv > torso + hem - 1.5) c = JK.D;
      if (cos.sparkle) { const h = _hash(Math.round(uu * 2) + seed * 7, Math.round(vv) + seed * 3); if (h < 0.09) c = C('#fff6c8'); else if (h < 0.2) c = JK.L; else if (h > 0.9) c = JK.S; }
      if (cos.pat) { const r = TORSO_PAT[cos.pat](uu, vv, tw, torso, du, vOpen, cos, seed, s, look); if (r) c = r; }
      return c;
    });
  };

  // ---- testa ----
  const drawHead = () => {
    const [nx, ny] = P2(1.5, -1);
    const hp = S_('head');
    if (hp) {
      const s = pb.s;
      if (pose.lie) pb.shape(nx, ny, L, -hp.ax / s, (hp.w - hp.ax) / s, -hp.ay / s, (hp.h - hp.ay) / s, (u, v) => hp.px(Math.floor(u * s + hp.ax), Math.floor(v * s + hp.ay)));
      else {
        const X0 = Math.round((nx + pose.head[0]) * s - hp.ax), Y0 = Math.round((ny + pose.head[1]) * s - hp.ay);
        for (let j = 0; j < hp.h; j++) for (let i = 0; i < hp.w; i++) { const c = hp.px(i, j); if (c) pb.setHi(X0 + i, Y0 + j, c); }
      }
      return;
    }
    const hb = headBuf(look);
    if (pose.lie) {
      pb.shape(nx, ny, L, -HEAD_AX, HEAD_W - HEAD_AX, -HEAD_AY, HEAD_H - HEAD_AY, (u, v) => hb.get(u + HEAD_AX, v + HEAD_AY));
    } else {
      const s = pb.s;
      pb.blitBuf(hb, Math.round((nx - HEAD_AX + pose.head[0]) * s), Math.round((ny - HEAD_AY + pose.head[1]) * s));
    }
  };

  const instKey = look.instrument;
  const inst = pose.inst || { m: 'worn' };
  const drawInst = () => {
    if (inst.m === 'none') {
      // i nemici armati tengono il loro oggetto in mano anche quando non attaccano
      if (look.carry && instKey) { const h = handAt[look.carry.h || 'F']; if (h) drawInstrument(pb, instKey, h[0], h[1], look.carry.a + (pose.lean || 0) * 0.3, look.carry.g ?? 0); }
      return;
    }
    if (inst.kThrow) { const h = handAt[inst.h || 'B']; if (h) drawInstrument(pb, look.throwItem || 'vinyl', h[0], h[1], inst.a, 'mid'); return; }
    if (!instKey) return;
    if (inst.m === 'worn') {
      const w = look.worn || { u: 3, v: 18, a: 162, g: 'body' };
      const [x, y] = P2(w.u, w.v);
      drawInstrument(pb, instKey, x, y, w.a + pose.lean * 0.5, w.g);
    } else if (inst.m === 'hand') {
      const h = handAt[inst.h || 'F'];
      if (!h) return;
      drawInstrument(pb, inst.k || instKey, h[0], h[1], inst.a, inst.g ?? 0);
      if (inst.k2) { const h2 = handAt[inst.h === 'B' ? 'F' : 'B']; if (h2) drawInstrument(pb, inst.k2, h2[0], h2[1], inst.a2 ?? inst.a, inst.g ?? 0); }
    } else if (inst.m === 'at') {
      drawInstrument(pb, inst.k || instKey, ox + inst.x, oy + inst.y, inst.a, inst.g ?? 0);
    }
  };

  // arma raccolta nella mano davanti (lo strumento resta a tracolla)
  const wpn = pose.wpn;
  const drawWpn = () => { const h = handAt[wpn.h || 'F']; if (h) drawInstrument(pb, wpn.k, h[0], h[1], wpn.a, wpn.g ?? 0); };

  if (pose.hide) return;
  if (look.cape) look.cape(pb, P2, pose, seed);
  if (wpn && wpn.behind) drawWpn();
  drawArm(geoB, true);
  drawLeg(pose.legB, true);
  drawLeg(pose.legF, false);
  drawTorso();
  if (inst.behind) drawInst();
  drawHead();
  if (look.headFx) look.headFx(pb, P2, seed);
  if (!inst.behind && !inst.front) drawInst();
  if (wpn && !wpn.behind) drawWpn();
  drawArm(geoF, false);
  if (inst.front) drawInst();
}

// ---------------- scie dei colpi (dopo il contorno) ----------------
function drawFx(pb, fx, b = 1) {
  if (!fx) return;
  const c1 = col('#fffbe6', 240), c2 = col('#ffe08a', 200), c3 = col('#ff9a3a', 130);
  const k = 1.6 * b, s = pb.s;
  const cx = FOOT_X + (fx.x || 4) * k, cy = FOOT_Y - (fx.y || 34) * k;
  const r = (fx.r || 26) * k;
  for (let a = fx.a0; a <= fx.a1; a += 0.5) {
    const ar = a * DEG, prog = (a - fx.a0) / Math.max(1, fx.a1 - fx.a0);
    const w = Math.max(1, (fx.w || 3) * 1.4 * Math.sin(prog * Math.PI) + 1);
    for (let t = 0; t < w; t += 1 / s) {
      const rr = r - t;
      pb.dot(cx + Math.sin(ar) * rr, cy - Math.cos(ar) * rr, t < 0.6 ? c1 : t < w - 1 ? c2 : c3);
    }
  }
}

// ---------------- cache dei frame (ritagliati) ----------------
const _frameCache = new Map();
function getFrame(look, costume, pose, key, seed = 0) {
  const k = look.id + '|' + costume + '|' + key;
  let f = _frameCache.get(k);
  if (f) return f;
  const pb = new PixBuf(FRAME_W, FRAME_H, RS);
  drawFigure(pb, look, pose, costume, seed);
  pb.outlineSel(OUTLINE, 0.74);
  drawFx(pb, pose.fx, (look.build && look.build.h) || 1);
  const bb = pb.bbox() || { x0: FOOT_X * RS, y0: FOOT_Y * RS, x1: FOOT_X * RS, y1: FOOT_Y * RS };
  const cp = pb.crop(bb);
  const cv = cp.toCanvas();
  f = { cv, ox: FOOT_X * RS - bb.x0, oy: FOOT_Y * RS - bb.y0, flash: null, _w: cp };
  _frameCache.set(k, f);
  _frameTouch(k);
  return f;
}
function frameFlash(f) { if (!f.flash) { const w = PixBuf.hi(f._w.W, f._w.H, RS); w.d.set(f._w.d); w.silhouette(col('#ffffff')); f.flash = w.toCanvas(); f._w = null; } return f.flash; }
// limite di memoria: i frame usati meno di recente vengono scartati (e rigenerati se servono)
let _frameTick = 0;
const FRAME_CACHE_MAX = 1000;
function _frameTouch(k) {
  const f = _frameCache.get(k); if (f) f.t = ++_frameTick;
  if (_frameCache.size > FRAME_CACHE_MAX) {
    const arr = [..._frameCache.entries()].sort((a, b) => a[1].t - b[1].t);
    for (let i = 0; i < 150; i++) _frameCache.delete(arr[i][0]);
  }
}

function drawSprite(ctx, frame, sx, sy, facing, opts = {}) {
  const img = opts.flash ? frameFlash(frame) : frame.cv;
  frame.t = ++_frameTick;
  const x = Math.round(sx * RS) / RS, y = Math.round(sy * RS) / RS;
  const w = img.width / RS, h = img.height / RS, ox = frame.ox / RS, oy = frame.oy / RS;
  if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
  if (facing < 0) {
    ctx.save(); ctx.translate(x, 0); ctx.scale(-1, 1);
    ctx.drawImage(img, -ox, y - oy, w, h);
    ctx.restore();
  } else ctx.drawImage(img, x - ox, y - oy, w, h);
  if (opts.alpha !== undefined) ctx.globalAlpha = 1;
}

const Atlas = {

  _derive(id, newId, parts, fn) {

  // nemico di colore diverso: ruota la tinta di tutto tranne la pelle
  hued(id, deg) {

// estrae una frase rispettando l'opzione BATTUTE
function pickLine(list) {
  if (!list || !list.length) return null;
  const vulgar = typeof Opts === 'undefined' || Opts.lines !== 'pulite';
  // prefissi: "~" = volgare (saltata in PULITE), "^" = tormentone vero del musicista (esce molto più spesso)
  const tag = x => { const m = /^[~^]*/.exec(x)[0]; return { v: m.includes('~'), c: m.includes('^'), txt: x.slice(m.length) }; };
  const ok = list.map(tag).filter(o => vulgar || !o.v);
  if (!ok.length) return null;
  const pool = [];
  for (const o of ok) { const w = (o.c ? 5 : 1) * (vulgar && o.v ? 2 : 1); for (let i = 0; i < w; i++) pool.push(o.txt); }
  return pick(pool);
}
// fumetti dei nemici: al massimo due alla volta sullo schermo
function enemyMayTalk() { return G.enemies.filter(e => e.bubble).length < 2 && G.frame - (G.lastEnemyTalk || -999) > 50; }
// ============================================================
// Animazioni: pose chiave per famiglia di strumento
// Ogni animazione è una lista di {p: posa, d: durata in frame}
// Gli attacchi hanno 3 pose: caricamento (w), colpo attivo (a), recupero (r)
// ============================================================
function walkFrames(n, o) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const ph = (i / n) * Math.PI * 2;
    const aF = o.amp * Math.sin(ph), aB = -o.amp * Math.sin(ph);
    const kF = o.knee0 + o.knee * Math.max(0, Math.cos(ph));
    const kB = o.knee0 + o.knee * Math.max(0, -Math.cos(ph));
    const sw = Math.sin(ph) * (o.armSwing || 0);
    out.push({
      p: P(Object.assign({}, o.base, {
        legF: [aF, kF], legB: [aB, kB],
        armF: o.armsFixed ? o.base.armF : [o.base.armF[0] - sw, o.base.armF[1]],
        armB: o.armsFixed ? o.base.armB : [o.base.armB[0] + sw, o.base.armB[1]],
      })), d: o.d
    });
  }
  return out;
}

const KEYMAP = {
  // tastiera unica (un solo giocatore su tastiera): tutti i tasti valgono
  solo: {
    left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
    atk: ['KeyJ', 'KeyZ', 'KeyF', 'Numpad1'], jump: ['KeyK', 'KeyX', 'KeyG', 'Space', 'Numpad2'],
    heavy: ['KeyL', 'KeyC', 'KeyH', 'Numpad3'], spec: ['KeyI', 'KeyV', 'KeyT', 'Numpad0'],
    start: ['Enter', 'KeyP', 'NumpadEnter'], back: ['Escape', 'Backspace'],
  },
  // due giocatori sulla stessa tastiera
  kbA: {
    left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'],
    atk: ['KeyF'], jump: ['KeyG'], heavy: ['KeyH'], spec: ['KeyT'], start: ['Digit1'], back: ['Escape'],
  },
  kbB: {
    left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'],
    atk: ['Numpad1', 'Comma', 'KeyJ'], jump: ['Numpad2', 'Period', 'KeyK'], heavy: ['Numpad3', 'Slash', 'KeyL'],
    spec: ['Numpad0', 'KeyI'], start: ['Enter', 'NumpadEnter'], back: ['Backspace'],
  },
};
const PREVENT = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space']);

const Input = {
  keys: new Set(),
  touch: { left: false, right: false, up: false, down: false, atk: false, jump: false, heavy: false, spec: false, start: false, back: false },
  tapped: new Set(), touchTap: new Set(),
  touchSeen: false,
  splitKeyboard: false,      // true quando ci sono 2 giocatori su tastiera
  sources: {},               // id -> {held, prev, pressed}
  anyPressedSource: null,
  lastKeyCode: null,

  init() {
    window.addEventListener('keydown', e => {
      if (PREVENT.has(e.code)) e.preventDefault();
      if (!e.repeat) { this.lastKeyCode = e.code; this.tapped.add(e.code); }
      this.keys.add(e.code);
      Audio2.unlock();
    });
    window.addEventListener('keyup', e => this.keys.delete(e.code));
    window.addEventListener('pointerdown', () => Audio2.unlock(), true);
    // tocco o clic sullo schermo di gioco = START (titolo e menu)
    const scr = document.getElementById('screen');
    if (scr) scr.addEventListener('pointerdown', e => { e.preventDefault(); if (typeof Game !== 'undefined' && Game.name !== 'play') this.touchTap.add('start'); if (e.pointerType === 'touch') { this.touchSeen = true; Touch.update(); } });
    window.addEventListener('blur', () => this.keys.clear());
    ['kb', 'kbA', 'kbB', 'touch', 'pad0', 'pad1', 'pad2', 'pad3'].forEach(id => this.sources[id] = this._blank());
  },
  _blank() { const o = { held: {}, prev: {}, pressed: {} }; ACTIONS.forEach(a => { o.held[a] = false; o.prev[a] = false; o.pressed[a] = false; }); return o; },

  _setFrom(src, getter) {
    for (const a of ACTIONS) { src.prev[a] = src.held[a]; src.held[a] = !!getter(a); src.pressed[a] = src.held[a] && !src.prev[a]; }
  },

  poll() {
    const k = this.keys;
    const tp = this.tapped;
    const kdown = (map, a) => (map[a] || []).some(c => k.has(c) || tp.has(c));
    this._setFrom(this.sources.kb, a => kdown(KEYMAP.solo, a));
    this._setFrom(this.sources.kbA, a => kdown(KEYMAP.kbA, a));
    this._setFrom(this.sources.kbB, a => kdown(KEYMAP.kbB, a));
    this._setFrom(this.sources.touch, a => this.touch[a] || this.touchTap.has(a));
    this.tapped.clear(); this.touchTap.clear();
    let pads = [];
    try { pads = navigator.getGamepads ? Array.from(navigator.getGamepads()) : []; } catch (e) { pads = []; }
    for (let i = 0; i < 4; i++) {
      const gp = pads[i];
      const src = this.sources['pad' + i];
      if (!gp || !gp.connected) { this._setFrom(src, () => false); src.connected = false; continue; }
      src.connected = true;
      const b = n => gp.buttons[n] && (gp.buttons[n].pressed || gp.buttons[n].value > 0.5);
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0, dz = 0.42;
      this._setFrom(src, a => {
        switch (a) {
          case 'left': return ax < -dz || b(14);
          case 'right': return ax > dz || b(15);
          case 'up': return ay < -dz || b(12);
          case 'down': return ay > dz || b(13);
          case 'atk': return b(2);
          case 'jump': return b(0);
          case 'heavy': return b(3) || b(5);
          case 'spec': return b(1) || b(4);
          case 'start': return b(9);
          case 'back': return b(8);
        }
      });
    }
  },

  // Sorgente "menu": qualsiasi dispositivo
  menu() {
    const o = { left: false, right: false, up: false, down: false, atk: false, jump: false, heavy: false, spec: false, start: false, back: false };
    for (const id in this.sources) { if (id.startsWith('cpu')) continue; const s = this.sources[id]; for (const a of ACTIONS) if (s.pressed[a]) o[a] = true; }
    return o;
  },
  // Quale sorgente ha appena premuto un pulsante di conferma (per entrare in partita)
  joinPress(excluded) {
    const order = ['kb', 'pad0', 'pad1', 'pad2', 'pad3', 'touch'];
    for (const id of order) {
      if (excluded.includes(id)) continue;
      const s = this.sources[id];
      if (s.pressed.atk || s.pressed.start || s.pressed.jump) return id;
    }
    // secondo giocatore su tastiera: tasto 2
    if (!excluded.includes('kbB') && excluded.includes('kb') && this.keys.has('Digit2')) return 'kbB';
    return null;
  },
  // Stato da usare per un giocatore legato a una sorgente
  state(id) {
    if (id === 'kb' && this.splitKeyboard) return this.sources.kbA;
    return this.sources[id] || this.sources.kb;
  },
  clearEdges() { for (const id in this.sources) if (!id.startsWith('cpu')) for (const a of ACTIONS) this.sources[id].pressed[a] = false; },
};

// ---------- Controlli touch (HTML sopra il canvas) ----------
const Touch = {
  el: null, stick: null, knob: null, active: false, stickId: null, stickOrigin: null, mode: 'auto',
  init() {
    this.el = document.getElementById('touch');
    this.stick = document.getElementById('stick');
    this.knob = document.getElementById('knob');
    const btns = this.el.querySelectorAll('[data-act]');
    btns.forEach(b => {
      const act = b.dataset.act;
      const down = e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (er) { } Input.touch[act] = true; Input.touchTap.add(act); b.classList.add('on'); Audio2.unlock(); };
      const up = e => { e.preventDefault(); Input.touch[act] = false; b.classList.remove('on'); };
      b.addEventListener('pointerdown', down);
      b.addEventListener('pointerup', up);
      b.addEventListener('pointercancel', up);
      b.addEventListener('lostpointercapture', up);
    });
    const zone = document.getElementById('stickzone');
    zone.addEventListener('pointerdown', e => {
      e.preventDefault(); Audio2.unlock();
      if (this.stickId !== null) return;
      this.stickId = e.pointerId; try { zone.setPointerCapture(e.pointerId); } catch (er) { }
      const r = zone.getBoundingClientRect();
      this.stickOrigin = [e.clientX, e.clientY];
      this.stick.style.left = (e.clientX - r.left) + 'px'; this.stick.style.top = (e.clientY - r.top) + 'px';
      this.stick.classList.add('on');
      this._move(e.clientX, e.clientY);
    });
    zone.addEventListener('pointermove', e => { if (e.pointerId === this.stickId) { e.preventDefault(); this._move(e.clientX, e.clientY); } });
    const end = e => {
      if (e.pointerId !== this.stickId) return;
      this.stickId = null; this.stick.classList.remove('on');
      Input.touch.left = Input.touch.right = Input.touch.up = Input.touch.down = false;
      this.knob.style.transform = 'translate(-50%,-50%)';
    };
    zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end); zone.addEventListener('lostpointercapture', end);
    window.addEventListener('touchstart', () => { if (!Input.touchSeen) { Input.touchSeen = true; this.update(); } }, { passive: true });
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) Input.touchSeen = true;
    this.update();
  },
  _move(x, y) {
    const [ox, oy] = this.stickOrigin;
    let dx = x - ox, dy = y - oy;
    const max = 38, d = Math.hypot(dx, dy);
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    this.knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    const t = 13;
    Input.touch.left = dx < -t; Input.touch.right = dx > t; Input.touch.up = dy < -t; Input.touch.down = dy > t;
  },
  update() {
    const show = this.mode === 'sempre' || (this.mode === 'auto' && Input.touchSeen);
    this.active = show;
    document.body.classList.toggle('has-touch', show);
    if (typeof resize === 'function') resize();
  },
};
// ============================================================
// AUDIO: sintesi Web Audio, nessun file. Brani originali composti qui.
// L'AudioContext nasce sospeso finché l'utente non preme un tasto (autoplay).
//
// Musica senza scatti: ogni brano viene prima "registrato" in un
// OfflineAudioContext e poi suonato come buffer in loop, indipendente dal gioco.
// Per registrare in fretta, ogni strumento è a sua volta un campione
// (generato una volta sola con la sintesi qui sotto) suonato a diverse altezze.
// ============================================================
const NOTE = (() => {
  const names = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
  return s => { const m = /^([A-G][#b]?)(-?\d)$/.exec(s); return m ? 12 * (+m[2] + 1) + names[m[1]] : null; };
})();
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const OAC_ = () => window.OfflineAudioContext || window.webkitOfflineAudioContext;
const SR = 44100;

// ---------- sintesi degli strumenti (usata solo per creare i campioni) ----------
// "A" è un contesto: A.ctx (AudioContext o Offline), A.out (uscita), A.noiseBuf
const SYN = {
  env(g, t, a, peak, dec, sus = 0.0001) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(Math.max(sus, 0.0001), t + a + dec);
  },
  noise(A, t, dur, type, freq, gainV, q = 0.7) {
    const c = A.ctx, s = c.createBufferSource(); s.buffer = A.noiseBuf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); SYN.env(g, t, 0.002, gainV, dur);
    s.connect(f); f.connect(g); g.connect(A.out);
    s.start(t, 0.1); s.stop(t + dur + 0.05);
  },
  osc(A, type, f, t, dur, peak, a = 0.004, sus = 0.0001, dest = null) {
    const c = A.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    SYN.env(g, t, a, peak, dur, sus);
    o.connect(g); g.connect(dest || A.out); o.start(t); o.stop(t + dur + a + 0.05);
    return o;
  },
  kick(A, t) {
    const c = A.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(155, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
    SYN.env(g, t, 0.003, 0.95, 0.2); o.connect(g); g.connect(A.out); o.start(t); o.stop(t + 0.25);
  },
  kick808(A, t) {
    const c = A.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.3);
    SYN.env(g, t, 0.003, 1, 0.75); o.connect(g); g.connect(A.out); o.start(t); o.stop(t + 0.9);
    SYN.noise(A, t, 0.02, 'lowpass', 2000, 0.3);
  },
  snare(A, t) {
    SYN.noise(A, t, 0.16, 'highpass', 1300, 0.5);
    const c = A.ctx, o = c.createOscillator(), og = c.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.08);
    SYN.env(og, t, 0.002, 0.35, 0.09); o.connect(og); og.connect(A.out); o.start(t); o.stop(t + 0.15);
  },
  rim(A, t) { SYN.noise(A, t, 0.03, 'bandpass', 2600, 0.6, 3); SYN.osc(A, 'square', 1700, t, 0.03, 0.12); },
  clap(A, t) { for (let i = 0; i < 3; i++) SYN.noise(A, t + i * 0.012, 0.09, 'bandpass', 1500, 0.35, 1.2); },
  hat(A, t, open) { SYN.noise(A, t, open ? 0.22 : 0.045, 'highpass', 7500, 0.16); },
  shaker(A, t) { SYN.noise(A, t, 0.06, 'bandpass', 6000, 0.12, 1.5); },
  crash(A, t) { SYN.noise(A, t, 1.1, 'highpass', 4500, 0.22); },
  // basso elettrico (dente di sega filtrato)
  bass(A, t, m, dur) {
    const c = A.ctx, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth'; o.frequency.value = mtof(m);
    f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(320, t + dur); f.Q.value = 3;
    SYN.env(g, t, 0.005, 0.5, dur * 0.95, 0.14);
    o.connect(f); f.connect(g); g.connect(A.out); o.start(t); o.stop(t + dur + 0.06);
  },
  // contrabbasso pizzicato (jazz, country)
  upright(A, t, m, dur) {
    const c = A.ctx, o = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'triangle'; o2.type = 'sine'; o.frequency.value = mtof(m); o2.frequency.value = mtof(m) * 2;
    f.type = 'lowpass'; f.frequency.setValueAtTime(1400, t); f.frequency.exponentialRampToValueAtTime(380, t + 0.25);
    const g2 = c.createGain(); g2.gain.value = 0.25;
    SYN.env(g, t, 0.004, 0.75, dur, 0.0001);
    o.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(A.out); o.start(t); o2.start(t); o.stop(t + dur + 0.1); o2.stop(t + dur + 0.1);
  },
  // sub dell'hip hop
  sub(A, t, m, dur) { SYN.osc(A, 'sine', mtof(m), t, dur, 0.9, 0.01, 0.5); },
  // chitarra distorta: accordo di sega leggermente scordate, saturate e filtrate
  guitar(A, t, notes, dur, mute, clean) {
    const c = A.ctx, mixG = c.createGain(), ws = c.createWaveShaper(), f = c.createBiquadFilter(), g = c.createGain();
    ws.curve = Audio2.distCurve; f.type = 'lowpass'; f.frequency.value = clean ? 2600 : mute ? 1500 : 3200; f.Q.value = 0.8;
    mixG.gain.value = clean ? 0.9 : 0.4;
    for (const m of notes) for (const det of (clean ? [0] : [-7, 7])) {
      const o = c.createOscillator(); o.type = clean ? 'triangle' : 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det;
      o.connect(mixG); o.start(t); o.stop(t + dur + 0.08);
    }
    const d = mute ? Math.min(dur, 0.1) : dur;
    SYN.env(g, t, 0.004, clean ? 0.3 : 0.2, d, mute ? 0.0001 : (clean ? 0.02 : 0.06));
    if (clean) mixG.connect(f); else { mixG.connect(ws); ws.connect(f); }
    f.connect(g); g.connect(A.out);
  },
  // banjo / chitarra pizzicata
  pluck(A, t, m, dur) {
    const c = A.ctx, o = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'square'; o2.type = 'sawtooth'; o.frequency.value = mtof(m); o2.frequency.value = mtof(m) * 1.003;
    f.type = 'lowpass'; f.frequency.setValueAtTime(5200, t); f.frequency.exponentialRampToValueAtTime(700, t + 0.18); f.Q.value = 2;
    SYN.env(g, t, 0.002, 0.22, Math.min(dur, 0.5));
    o.connect(f); o2.connect(f); f.connect(g); g.connect(A.out); o.start(t); o2.start(t); o.stop(t + dur + 0.1); o2.stop(t + dur + 0.1);
  },
  lead(A, t, m, dur, trem, wave, tremHz) {
    const c = A.ctx, o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = wave; o.frequency.value = mtof(m);
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 5.5; lg.gain.value = 7;
    lfo.connect(lg); lg.connect(o.detune); lfo.start(t); lfo.stop(t + dur + 0.1);
    f.type = 'lowpass'; f.frequency.value = 3400;
    SYN.env(g, t, 0.006, 0.14, Math.max(0.05, dur * 0.9), 0.05);
    if (trem) {
      const tl = c.createOscillator(), tg = c.createGain(); tl.type = 'square'; tl.frequency.value = tremHz; tg.gain.value = 0.06;
      tl.connect(tg); tg.connect(g.gain); tl.start(t); tl.stop(t + dur + 0.05);
    }
    o.connect(f); f.connect(g); g.connect(A.out); o.start(t); o.stop(t + dur + 0.1);
  },
  piano(A, t, m, dur) {
    const c = A.ctx, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o2.type = 'sine'; o.frequency.value = mtof(m); o2.frequency.value = mtof(m) * 2;
    SYN.env(g, t, 0.003, 0.11, Math.min(0.9, dur * 1.3));
    o.connect(g); o2.connect(g); g.connect(A.out); o.start(t); o2.start(t); o.stop(t + dur + 0.7); o2.stop(t + dur + 0.7);
  },
  organ(A, t, m, dur) {
    const c = A.ctx, g = c.createGain();
    SYN.env(g, t, 0.01, 0.07, 0.05, 0.06);
    for (const [mul, v] of [[1, 1], [2, 0.6], [3, 0.35], [4, 0.25], [0.5, 0.5]]) { const o = c.createOscillator(), og = c.createGain(); o.type = 'sine'; o.frequency.value = mtof(m) * mul; og.gain.value = v; o.connect(og); og.connect(g); o.start(t); o.stop(t + dur + 0.1); }
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 6.2; lg.gain.value = 0.015; lfo.connect(lg); lg.connect(g.gain); lfo.start(t); lfo.stop(t + dur + 0.1);
    g.connect(A.out);
  },
  // archi / pad: denti di sega lenti e morbidi
  strings(A, t, m, dur) {
    const c = A.ctx, f = c.createBiquadFilter(), g = c.createGain();
    f.type = 'lowpass'; f.frequency.value = 2200;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.06, t + 0.25); g.gain.setValueAtTime(0.06, t + dur);
    for (const det of [-9, 0, 9]) { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det; o.connect(f); o.start(t); o.stop(t + dur + 0.1); }
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 5; lg.gain.value = 0.006; lfo.connect(lg); lg.connect(g.gain); lfo.start(t); lfo.stop(t + dur);
    f.connect(g); g.connect(A.out);
  },
  // coro "aah" (opera): formanti su un'onda ricca
  choir(A, t, m, dur) {
    const c = A.ctx, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), mixG = c.createGain();
    o.type = 'sawtooth'; o2.type = 'sawtooth'; o.frequency.value = mtof(m); o2.frequency.value = mtof(m); o2.detune.value = 12;
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 5.2; lg.gain.value = 14; lfo.connect(lg); lg.connect(o.detune); lg.connect(o2.detune);
    o.connect(mixG); o2.connect(mixG); mixG.gain.value = 0.5;
    for (const [fr, q, v] of [[730, 8, 1], [1090, 9, 0.5], [2440, 10, 0.25]]) { const bp = c.createBiquadFilter(), bg = c.createGain(); bp.type = 'bandpass'; bp.frequency.value = fr; bp.Q.value = q; bg.gain.value = v; mixG.connect(bp); bp.connect(bg); bg.connect(g); }
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5, t + 0.2); g.gain.setValueAtTime(0.5, t + dur);
    g.connect(A.out); o.start(t); o2.start(t); lfo.start(t); o.stop(t + dur + 0.1); o2.stop(t + dur + 0.1); lfo.stop(t + dur + 0.1);
  },
  brass(A, t, m, dur) {
    const c = A.ctx, o = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth'; o2.type = 'sawtooth'; o.frequency.value = mtof(m); o2.frequency.value = mtof(m); o2.detune.value = 6;
    f.type = 'lowpass'; f.frequency.setValueAtTime(600, t); f.frequency.linearRampToValueAtTime(2600, t + 0.06); f.frequency.exponentialRampToValueAtTime(1400, t + 0.3); f.Q.value = 1.5;
    SYN.env(g, t, 0.03, 0.12, Math.max(0.1, dur), 0.07);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(A.out); o.start(t); o2.start(t); o.stop(t + dur + 0.1); o2.stop(t + dur + 0.1);
  },
  bell(A, t, m, dur) {
    const c = A.ctx, g = c.createGain(); SYN.env(g, t, 0.002, 0.12, Math.min(1.6, dur + 0.8));
    for (const [mul, v] of [[1, 1], [2.76, 0.5], [5.4, 0.25]]) { const o = c.createOscillator(), og = c.createGain(); o.type = 'sine'; o.frequency.value = mtof(m) * mul; og.gain.value = v; o.connect(og); og.connect(g); o.start(t); o.stop(t + dur + 1); }
    g.connect(A.out);
  },
  // synth techno: dente di sega con filtro risonante

function parseLine(str) {
  // note per ottavi: "A4 . - C5" ('-' = tieni, '.' = pausa)
  const toks = str.trim().split(/\s+|\|/).filter(Boolean);
  const out = [];
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (t === '-' || t === '.') { out.push(null); continue; }
    let len = 1; while (toks[i + len] === '-') len++;
    out.push({ m: NOTE(t), len });
  }
  return out;
}

// Ogni colpo suona lo strumento di chi lo dà, intonato sull'accordo del brano
// che sta suonando in quel momento (Audio2.harmony()): una combo diventa un riff.
// Arrigo urla, Mike (chitarra solista) note singole distorte, Danny (chitarra ritmica) accordi,
// Mario il basso (con lo slap), Troy rullante, tom e piatti, Marvin accordi di piano.
// Le corde delle chitarre sono sintetizzate come corde pizzicate (Karplus-Strong).
// ============================================================
// formanti delle vocali (voce maschile, valori medi di Peterson e Barney, 1952)
const VOWELS = { a: [730, 1090, 2440], e: [530, 1840, 2480], i: [270, 2290, 3010], o: [570, 840, 2410], u: [300, 870, 2240] };
// volume misurato della voce sintetica da 90 a 340 Hz (passo 10) per vocale: serve a renderla uniforme a ogni altezza
const VOX_CAL = {
  a: [78, 96, 89, 94, 90, 120, 126, 101, 95, 115, 105, 95, 111, 145, 175, 211, 192, 146, 123, 107, 95, 92, 95, 104, 120, 146],
  e: [100, 121, 131, 110, 121, 118, 121, 150, 198, 208, 169, 138, 124, 120, 129, 145, 171, 197, 196, 174, 152, 139, 133, 128, 127, 130],
  o: [101, 106, 136, 133, 113, 127, 120, 127, 162, 197, 219, 184, 149, 128, 117, 119, 131, 156, 196, 232, 227, 196, 167, 148, 138, 134],
  u: [202, 233, 210, 193, 200, 218, 231, 224, 220, 219, 221, 234, 256, 284, 315, 354, 401, 454, 512, 568, 610, 620, 599, 559, 510, 461],
  i: [235, 216, 203, 214, 234, 237, 229, 226, 233, 250, 274, 305, 345, 391, 445, 503, 558, 597, 611, 596, 561, 515, 469, 427, 390, 356],
};
function voxGain(vw, f) { const T = VOX_CAL[vw] || VOX_CAL.a, x = clamp((f - 90) / 10, 0, T.length - 1), i = Math.floor(x), k = x - i; const r = (T[i] * (1 - k) + T[Math.min(T.length - 1, i + 1)] * k) / 1000; return 0.072 / r; }

const CSX = {
  // uscita con un volume proprio, collegata agli effetti
  bus(v) { const c = Audio2.ctx, g = c.createGain(); g.gain.value = v; g.connect(Audio2.sfx); return { ctx: c, out: g, noiseBuf: Audio2.noiseBuf }; },
  third(H) { return H.minor ? 3 : 4; },
  // n-esima nota della pentatonica (minore o maggiore secondo l'accordo) sopra "base"
  pent(H, base, n) { const sc = H.minor ? [0, 3, 5, 7, 10] : [0, 2, 4, 7, 9]; const o = Math.floor(n / 5), i = ((n % 5) + 5) % 5; return base + o * 12 + sc[i]; },
  env(g, t, a, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dur); },
  tone(A, type, f0, f1, t, dur, peak, a = 0.003) {
    const c = A.ctx, o = c.createOscillator(), g = c.createGain(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    CSX.env(g, t, a, peak, dur); o.connect(g); g.connect(A.out); o.start(t); o.stop(t + a + dur + 0.05);
  },
  noise(A, t, dur, type, f, peak, q = 0.8, f1 = null) {
    const c = A.ctx, s = c.createBufferSource(); s.buffer = A.noiseBuf;
    const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur); fl.Q.value = q;
    const g = c.createGain(); CSX.env(g, t, 0.002, peak, dur);
    s.connect(fl); fl.connect(g); g.connect(A.out); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  // impatto fisico leggero sotto la nota, perché il colpo resti un colpo
  thump(A, t, big) {
    CSX.tone(A, 'sine', big ? 120 : 160, big ? 40 : 60, t, big ? 0.16 : 0.08, big ? 0.55 : 0.35);
    CSX.noise(A, t, big ? 0.09 : 0.04, 'bandpass', big ? 900 : 1600, big ? 0.35 : 0.25, 1);
  },
  // voce: dente di sega e onda quadra filtrate da tre formanti, con soffio iniziale ("H")
  vox(A, t, f0, f1, dur, vw, peak, breath = true) {
    const c = A.ctx, o1 = c.createOscillator(), o2 = c.createOscillator(), mixG = c.createGain(), g = c.createGain(), g2 = c.createGain();
    o1.type = 'sawtooth'; o2.type = 'square'; g2.gain.value = 0.35;
    for (const o of [o1, o2]) { o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur); }
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 6.2; lg.gain.value = 22; lfo.connect(lg); lg.connect(o1.detune); lg.connect(o2.detune);
    o1.connect(mixG); o2.connect(g2); g2.connect(mixG);
    const F = VOWELS[vw] || VOWELS.a;
    [[F[0], 1], [F[1], 0.55], [F[2], 0.28]].forEach(([fr, v]) => { const bp = c.createBiquadFilter(), bg = c.createGain(); bp.type = 'bandpass'; bp.frequency.value = fr; bp.Q.value = fr / 90; bg.gain.value = v * 3.2; mixG.connect(bp); bp.connect(bg); bg.connect(g); });
    const pk = peak * voxGain(vw, Math.sqrt(f0 * f1));
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(pk, t + 0.018); g.gain.setValueAtTime(pk, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(A.out);
    for (const o of [o1, o2, lfo]) { o.start(t); o.stop(t + dur + 0.05); }
    if (breath) CSX.noise(A, t, 0.05, 'bandpass', 1400, peak * 0.5, 1.2);
  },
  // corda pizzicata (Karplus-Strong): rumore che passa in un anello di ritardo lungo un periodo;
  // il buffer si calcola una volta per nota, l'intonazione esatta la dà playbackRate
  _ks: new Map(),
  ksBuf(m, bright) {
    const key = m + '|' + bright; let k = this._ks.get(key); if (k) return k;
    const sr = 44100, f = mtof(m), N = Math.max(2, Math.round(sr / f - 0.5)), len = Math.ceil(sr * 2.4);
    const buf = new AudioBuffer({ length: len, sampleRate: sr, numberOfChannels: 1 }), d = buf.getChannelData(0);
    let p = 0, mean = 0;
    for (let i = 0; i < N; i++) { p += bright * ((Math.random() * 2 - 1) - p); d[i] = p; mean += p; }
    mean /= N; for (let i = 0; i < N; i++) d[i] -= mean;
    const T60 = clamp(3.4 - (m - 40) * 0.065, 0.7, 3.4), rho = Math.pow(0.001, 1 / (f * T60));
    for (let i = N; i < len; i++) d[i] = rho * 0.5 * (d[i - N] + (i - N - 1 >= 0 ? d[i - N - 1] : 0));
    k = { buf, rate: f / (sr / (N + 0.5)) };
    if (this._ks.size > 400) this._ks.clear();
    this._ks.set(key, k); return k;
  },
  // una corda: o.bend (semitoni tirati), o.dive (picchiata con la leva), o.vib (vibrato), o.dest (catena d'effetti)
  string(A, t, m, dur, peak, o = {}) {
    const c = A.ctx, K = CSX.ksBuf(m, o.bright ?? 0.6), src = c.createBufferSource(), g = c.createGain();
    src.buffer = K.buf; src.playbackRate.setValueAtTime(K.rate, t);
    if (o.bend) { src.playbackRate.setValueAtTime(K.rate, t + 0.06); src.playbackRate.exponentialRampToValueAtTime(K.rate * Math.pow(2, o.bend / 12), t + 0.18); }
    if (o.dive) src.playbackRate.exponentialRampToValueAtTime(K.rate * Math.pow(2, o.dive / 12), t + dur);
    if (o.vib) { const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 5.8; lg.gain.value = K.rate * 0.014; lfo.connect(lg); lg.connect(src.playbackRate); lfo.start(t + 0.2); lfo.stop(t + dur + 0.05); }
    g.gain.setValueAtTime(peak, t); g.gain.setValueAtTime(peak, t + Math.max(0.01, dur - 0.06)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(g); g.connect(o.dest || A.out); src.start(t); src.stop(t + dur + 0.05);
  },
  // catena di distorsione: drive = 'lead' (saturazione piena, come Mike) o 'crunch' (leggera, come Danny)
  amp(A, drive, lvl = 1) {
    const c = A.ctx, pre = c.createGain(), ws = c.createWaveShaper(), hp = c.createBiquadFilter(), lp = c.createBiquadFilter(), post = c.createGain();
    if (!CSX._crunch) { const n = 512, k = 5, cv = new Float32Array(n); for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; cv[i] = (1 + k) * x / (1 + k * Math.abs(x)); } CSX._crunch = cv; }
    ws.curve = drive === 'lead' ? Audio2.distCurve : CSX._crunch;
    pre.gain.value = drive === 'lead' ? 3 : 1.6;
    hp.type = 'highpass'; hp.frequency.value = drive === 'lead' ? 160 : 90;
    lp.type = 'lowpass'; lp.frequency.value = drive === 'lead' ? 3800 : 4200; lp.Q.value = 0.9;
    post.gain.value = (drive === 'lead' ? 0.13 : 0.155) * lvl;
    pre.connect(ws); ws.connect(hp); hp.connect(lp); lp.connect(post); post.connect(A.out);
    return pre;
  },
  // accordo strappato su sei corde (voicing a barré): dir 1 = pennata in giù, -1 = in su; mute = stoppato
  strum(A, t, H, dir, dur, peak, o = {}) {
    const r = H.root, tr = CSX.third(H);
    let notes = [r, r + 7, r + 12, r + 12 + tr, r + 19, r + 24];
    if (dir < 0) notes = notes.slice(2).reverse();                 // in su: le corde alte per prime
    const dest = CSX.amp(A, 'crunch', o.lvl || 1), gap = o.gap ?? (dir < 0 ? 0.007 : 0.011);
    notes.forEach((m, i) => CSX.string(A, t + i * gap, m, o.mute ? 0.07 : dur, peak * (dir < 0 ? 0.8 : 1) * (1 - i * 0.04), { bright: o.mute ? 0.25 : 0.55, dest }));
    if (o.mute) CSX.noise(A, t, 0.05, 'bandpass', 1400, peak * 0.9, 1.2);   // il "ciak" della mano che stoppa
  },
  // basso elettrico; kind 'slap' (pollice, con schiocco) o 'pop' (corda tirata, ottava sopra); m1 = glissato
  bassNote(A, t, m, dur, peak, kind = '', m1 = null) {
    const c = A.ctx, o = c.createOscillator(), sub = c.createOscillator(), fl = c.createBiquadFilter(), g = c.createGain(), gs = c.createGain();
    const mm = kind === 'pop' ? m + 12 : m;
    o.type = kind === 'pop' ? 'square' : 'sawtooth'; sub.type = 'sine'; gs.gain.value = kind === 'pop' ? 0.2 : 0.9;
    for (const x of [o, sub]) { x.frequency.setValueAtTime(mtof(mm), t); if (m1 !== null) x.frequency.exponentialRampToValueAtTime(mtof(m1), t + dur); }
    fl.type = 'lowpass'; fl.Q.value = kind ? 4 : 2;
    fl.frequency.setValueAtTime(kind ? 3200 : 1200, t); fl.frequency.exponentialRampToValueAtTime(kind ? 600 : 320, t + Math.min(0.25, dur));
    CSX.env(g, t, 0.003, peak, dur);
    o.connect(fl); sub.connect(gs); gs.connect(fl); fl.connect(g); g.connect(A.out);
    for (const x of [o, sub]) { x.start(t); x.stop(t + dur + 0.05); }
    if (kind) CSX.noise(A, t, 0.018, 'highpass', 3500, peak * 1.4, 0.7);
  },
  snare(A, t, v = 1) { CSX.noise(A, t, 0.15, 'highpass', 1300, 0.55 * v); CSX.tone(A, 'triangle', 230, 150, t, 0.08, 0.35 * v); },
  tom(A, t, f, v = 1) { CSX.tone(A, 'sine', f * 1.6, f, t, 0.24, 0.75 * v); CSX.tone(A, 'triangle', f * 1.6, f, t, 0.1, 0.25 * v); CSX.noise(A, t, 0.03, 'lowpass', 1400, 0.3 * v); },
  kick(A, t, v = 1) { CSX.tone(A, 'sine', 150, 45, t, 0.2, 0.95 * v); CSX.noise(A, t, 0.015, 'lowpass', 2500, 0.35 * v); },
  crash(A, t, v = 1, dur = 0.9) { CSX.noise(A, t, dur, 'highpass', 4500, 0.28 * v); CSX.noise(A, t, dur * 0.6, 'bandpass', 6500, 0.18 * v, 1.5); },
  hat(A, t, v = 1, open = false) { CSX.noise(A, t, open ? 0.22 : 0.04, 'highpass', 7500, 0.3 * v); },
  piano(A, t, notes, dur) { for (const m of notes) SYN.piano(A, t, m, dur); },
};

// tavolozza di ogni musicista. o = { mv, step, big, combo }, H = accordo del momento, t = istante
const CHAR_SFX = {
  arrigo: {
    swing(A, H, t, o) {
      CSX.noise(A, t, 0.12, 'bandpass', 800, 1.5, 1.3, 1800);                          // il cavo che frusta l'aria
      if (o.mv && o.mv.snd === 'lasso') for (let i = 1; i < 3; i++) CSX.noise(A, t + i * 0.09, 0.08, 'bandpass', 900, 0.4, 1.4, 1900);
      if (o.mv && o.mv.snd === 'lasso') CSX.tone(A, 'sine', mtof(H.root + 67), mtof(H.root + 69), t, 0.5, 0.05, 0.05);   // larsen
    },
    hit(A, H, t, o) {
      const r = H.root, tr = CSX.third(H), n = (o.mv.note || 0) + o.step;
      let m = r + 24 + [0, tr, 7, 12][n % 4]; while (m > 66) m -= 12;
      CSX.thump(A, t, o.big);
      if (o.big) { CSX.vox(A, t, mtof(m + 7), mtof(m), 0.34, 'e', 0.5); CSX.vox(A, t + 0.12, mtof(m), mtof(m - 2), 0.22, 'a', 0.38, false); }   // "YEAH!"
      else CSX.vox(A, t, mtof(m), mtof(m - 1), 0.15, ['a', 'e', 'o', 'a'][n % 4], 0.45);                                                  // "HA!", "HEY!", "HO!"
      if (o.mv.snd === 'lasso') CSX.tone(A, 'sine', 95, 50, t, 0.12, 0.5);               // il microfono che sbatte
    },
    jump(A, H, t) { CSX.vox(A, t, mtof(H.root + 24), mtof(H.root + 31), 0.12, 'u', 0.55); },
    hurt(A, H, t) { CSX.vox(A, t, mtof(H.root + 28), mtof(H.root + 20), 0.2, 'o', 0.42); },
    special(A, H, t) { for (let i = 0; i < 2; i++) { CSX.tone(A, 'sine', 110, 55, t + i * 0.13, 0.09, 0.6); CSX.noise(A, t + i * 0.13, 0.05, 'lowpass', 600, 0.4); } CSX.tone(A, 'sine', mtof(H.root + 64), mtof(H.root + 69), t + 0.2, 0.6, 0.06, 0.2); },
    die(A, H, t) { CSX.vox(A, t, mtof(H.root + 31), mtof(H.root + 12), 0.85, 'o', 0.42); },
  },
  mike: {   // chitarra solista: note singole distorte
    swing(A, H, t, o) {
      CSX.noise(A, t, 0.07, 'bandpass', 2600, 1.5, 2, 1200);                            // plettro sulle corde
      if (o.mv && o.mv.sfx === 'swingBig') CSX.noise(A, t, 0.14, 'bandpass', 600, 0.5, 1);
    },
    hit(A, H, t, o) {
      const r = H.root, n = (o.mv.note || 0) + o.step;
      CSX.thump(A, t, o.big);
      const amp = CSX.amp(A, 'lead');
      if (o.mv.snd === 'windmill') { CSX.string(A, t, r + 19, 0.9, 0.9, { dest: amp, dive: -12, bright: 0.8 }); return; }       // picchiata con la leva
      if (o.big) { const m = CSX.pent(H, r + 36, 2); CSX.string(A, t, m, 0.8, 0.9, { dest: CSX.amp(A, 'lead', 1.6), bend: 2, vib: true, bright: 0.8 }); CSX.tone(A, 'sine', mtof(m + 12), mtof(m + 14), t + 0.25, 0.5, 0.04, 0.1); return; }
      CSX.string(A, t, CSX.pent(H, r + 24, n * 2 + 1), 0.26, 0.85, { dest: amp, bright: 0.75 });   // la frase sale a ogni colpo
    },
    jump(A, H, t) { CSX.noise(A, t, 0.26, 'bandpass', 3800, 1.4, 3, 500); },               // plettro strisciato sulle corde
    hurt(A, H, t) { CSX.vox(A, t, mtof(H.root + 22), mtof(H.root + 16), 0.2, 'u', 0.45); },
    special(A, H, t) { const amp = CSX.amp(A, 'lead'); for (let i = 0; i < 8; i++) CSX.string(A, t + i * 0.055, CSX.pent(H, H.root + 24, 3 + i), i === 7 ? 0.5 : 0.09, 0.8, { dest: amp, bright: 0.8, bend: i === 7 ? 2 : 0, vib: i === 7 }); },
    die(A, H, t) { const amp = CSX.amp(A, 'lead'); CSX.string(A, t, H.root + 24, 1.1, 0.8, { dest: amp, dive: -19 }); CSX.vox(A, t + 0.05, mtof(H.root + 24), mtof(H.root + 10), 0.7, 'o', 0.35); },
  },
  danny: {   // chitarra ritmica: accordi
    swing(A, H, t, o) { CSX.noise(A, t, 0.05, 'bandpass', 1800, 0.9, 1.4); CSX.noise(A, t, 0.03, 'highpass', 3000, 0.4); if (o.mv && o.mv.sfx === 'swingBig') CSX.noise(A, t + 0.03, 0.1, 'bandpass', 900, 0.7, 1.1); },
    hit(A, H, t, o) {
      const n = (o.mv.note || 0) + o.step;
      CSX.thump(A, t, o.big);
      if (o.big) { CSX.strum(A, t, H, 1, 0.9, 0.75, { gap: 0.014, lvl: 1.3 }); return; }        // accordo lasciato suonare
      if (n === 3) { CSX.strum(A, t, H, 1, 0.1, 0.8, { mute: true }); return; }         // ginocchiata: pennata stoppata
      CSX.strum(A, t, H, n % 2 ? -1 : 1, 0.28, 0.7);                                    // pennate alternate giù e su
    },
    jump(A, H, t) { CSX.strum(A, t, H, -1, 0.15, 0.45, { lvl: 0.9 }); },
    hurt(A, H, t) { CSX.vox(A, t, mtof(H.root + 26), mtof(H.root + 21), 0.15, 'e', 0.42); },
    special(A, H, t) { for (let i = 0; i < 6; i++) CSX.strum(A, t + i * 0.07, H, i % 2 ? -1 : 1, 0.12, 0.6); },
    die(A, H, t) { CSX.strum(A, t, { root: H.root, minor: true }, 1, 1.2, 0.6, { gap: 0.04 }); CSX.strum(A, t + 0.35, { root: H.root - 1, minor: true }, 1, 1, 0.5, { gap: 0.05 }); },
  },
  mario: {
    swing(A, H, t, o) { CSX.noise(A, t, 0.16, 'lowpass', 420, 2.2); CSX.noise(A, t, 0.1, 'bandpass', 900, 0.5, 1); if (o.mv && o.mv.snd === 'slap') CSX.noise(A, t, 0.02, 'highpass', 3000, 0.5); },
    hit(A, H, t, o) {
      const r = H.root, n = (o.mv.note || 0) + o.step;
      CSX.thump(A, t, o.big);
      if (o.mv.snd === 'slap') { CSX.bassNote(A, t, r, 0.22, 0.55, o.step ? 'pop' : 'slap'); return; }
      if (o.big) { CSX.bassNote(A, t, r + 12, 0.45, 0.6, '', r); return; }              // scivolata d'ottava verso la radice
      CSX.bassNote(A, t, r + [0, 7, 12, 7][n % 4], 0.22, 0.55);
    },
    jump(A, H, t) { CSX.bassNote(A, t, H.root, 0.18, 0.4, '', H.root + 7); },
    hurt(A, H, t) { CSX.vox(A, t, mtof(H.root + 24), mtof(H.root + 19), 0.18, 'o', 0.42); },
    special(A, H, t) { CSX.bassNote(A, t, H.root + 12, 0.5, 0.5, '', H.root - 5); },
    die(A, H, t) { CSX.bassNote(A, t, H.root + 7, 0.9, 0.55, '', H.root - 12); },
  },
  troy: {
    swing(A, H, t, o) { CSX.tone(A, 'square', 1700, 1500, t, 0.02, 0.22); CSX.noise(A, t, 0.03, 'bandpass', 2700, 1.0, 3); CSX.noise(A, t, 0.06, 'bandpass', 1200, 0.5, 1.2); if (o.mv && o.mv.sfx === 'swingBig') CSX.hat(A, t, 1.6); },
    hit(A, H, t, o) {
      const r = H.root, n = (o.mv.note || 0) + o.step;
      CSX.thump(A, t, false);
      if (o.mv.snd === 'kick') { CSX.kick(A, t, 0.7); CSX.tone(A, 'sine', mtof(r), mtof(r) * 0.98, t, 0.3, 0.35); return; }   // cassa accordata sulla radice
      if (o.mv.snd === 'roll') { CSX.snare(A, t, 0.8); return; }
      if (o.big) { CSX.crash(A, t, 1, 0.9); CSX.kick(A, t, 0.9); CSX.snare(A, t + 0.01, 0.8); return; }
      // giro di tamburi accordati: rullante, tom alto (quinta), rullante, tom medio (radice), colpo doppio
      const seq = ['snare', 'tomH', 'snare', 'tomM', 'flam', 'tomF'];
      const d = seq[n % seq.length];
      if (d === 'snare') CSX.snare(A, t, 1.35);
      else if (d === 'flam') { CSX.snare(A, t, 0.6); CSX.snare(A, t + 0.022, 1); }
      else CSX.tom(A, t, mtof(r + (d === 'tomH' ? 19 : d === 'tomM' ? 12 : 7)));
    },
    jump(A, H, t) { CSX.hat(A, t, 2.2, true); },
    hurt(A, H, t) { CSX.vox(A, t, mtof(H.root + 26), mtof(H.root + 22), 0.15, 'a', 0.42); },
    special(A, H, t) { const r = H.root; [19, 16, 12, 7].forEach((k, i) => CSX.tom(A, t + i * 0.07, mtof(r + k), 0.8)); },
    die(A, H, t) { CSX.crash(A, t, 1, 1.2); CSX.kick(A, t); CSX.tom(A, t + 0.1, mtof(H.root + 7)); },

  marvin: {
