SCENES.play = {
  update() {
    const m = Input.menu();
    if ((m.start || m.back) && !this.allOut()) {
      // START su un giocatore fuori gioco = rientra (continua)
      const outP = G.players.find(p => p.out && Input.state(p.src).pressed.start);
      if (outP) { outP.continueGame(); Audio2.sfxPlay('confirm'); }
      else { Audio2.sfxPlay('pause'); Game.go('pause'); return; }
    }
    if (G.slowmo > 0) { G.slowmo--; if (G.slowmo % 3 !== 0) return; }
    worldUpdate();
    if (this.allOut()) { Game.go('continue'); return; }
    const lv = G.level;
    if (lv.clearT === 120) { for (const p of G.players) if (p.active && !p.out && p.alive) { p.setState('victory', 'victory'); p.untouchable = true; if (!p.line('win', 1)) p.say(p.char.quotes.win, 140); } Audio2.play('clear', true); }
    if (lv.clearT >= 330) Game.go('results');
  },
  allOut() { const h = G.players.filter(p => !p.cpu); const list = h.length ? h : G.players; return list.length > 0 && list.every(p => p.out); },
  draw(ctx) {
    drawWorld(ctx);
    const lv = G.level;
    if (lv.clearT >= 120) {
      const k = Math.min(1, (lv.clearT - 120) / 16);
      ctx.fillStyle = `rgba(8,4,18,${0.5 * k})`; ctx.fillRect(0, 70, W, 40);

  },
};

function qualifies(score) { const s = SAVE.scores || []; return score > 0 && (s.length < 10 || score > s[s.length - 1].score); }
function toInitialsOrScores() {
  const q = G.players.filter(p => p.active && !p.cpu && qualifies(p.score)).sort((a, b) => b.score - a.score);
  if (q.length) Game.go('initials', q); else Game.go('scores', { back: 'title' });
}

const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789★ '.split('');
SCENES.initials = {
  enter(list) { this.list = list; this.i = 0; this.setup(); },
  setup() { const p = this.list[this.i]; this.p = p; this.pos = 0; this.letters = [p.char.name[0], p.char.name[1], p.char.name[2]].map(ch => LETTERS.indexOf(ch)); },
  update() {
    const inp = Input.state(this.p.src).pressed, m = Input.menu();
    const up = inp.up || m.up, down = inp.down || m.down;
    if (up) { this.letters[this.pos] = (this.letters[this.pos] + 1) % LETTERS.length; Audio2.sfxPlay('menu'); }
    if (down) { this.letters[this.pos] = (this.letters[this.pos] + LETTERS.length - 1) % LETTERS.length; Audio2.sfxPlay('menu'); }
    if (inp.left || m.left) this.pos = Math.max(0, this.pos - 1);
    if (inp.right || m.right) this.pos = Math.min(2, this.pos + 1);
    if (CONFIRM(m)) {
      Audio2.sfxPlay('confirm');
      if (this.pos < 2) { this.pos++; return; }
      const name = this.letters.map(i => LETTERS[i]).join('');
      SAVE.scores = (SAVE.scores || []).concat([{ name, score: this.p.score, char: this.p.char.name, d: new Date().toISOString().slice(0, 10) }]).sort((a, b) => b.score - a.score).slice(0, 10);
      saveAll();
      this.i++;
      if (this.i < this.list.length) this.setup(); else Game.go('scores', { back: 'title', hl: name });
    }
    if (BACK(m) && this.pos > 0) this.pos--;
  },
  draw(ctx) {
    ctx.fillStyle = '#0c0618'; ctx.fillRect(0, 0, W, H);
    drawText(ctx, 'NUOVO RECORD!', W / 2, 30, '#ffd23e', { align: 'center', scale: 2, outline: '#3a1a00' });
    ctx.fillStyle = shade(this.p.color, 0.35); ctx.fillRect(W / 2 - PORTRAIT_W, 46, PORTRAIT_W * 2, PORTRAIT_H * 2);
    blitHi(ctx, portrait(this.p.char, 2), W / 2 - PORTRAIT_W, 46);
    drawText(ctx, this.p.char.name + ' · ' + this.p.score, W / 2, 106, this.p.color, { align: 'center' });
    drawText(ctx, 'INSERISCI LE INIZIALI', W / 2, 118, '#c9b8e8', { align: 'center' });
    for (let i = 0; i < 3; i++) {
      const x = W / 2 - 36 + i * 26;

      drawText(ctx, LETTERS[this.letters[i]], x, 132, i === this.pos ? '#ffffff' : '#8a7aa8', { scale: 3 });
    }
    drawText(ctx, '↑↓ LETTERA · CONFERMA PER AVANZARE', W / 2, 176, '#8a7aa8', { align: 'center' });
  },
};

let _acc = 0, _last = 0;
function frame(ts) {
  if (!_last) _last = ts;
  let dt = ts - _last; _last = ts;
  if (dt > MAX_FRAME_MS) dt = MAX_FRAME_MS;
  _acc += dt;
  let steps = 0;
  while (_acc >= STEP_MS && steps < 8) {
    Input.poll();
    try { Game.update(); } catch (e) { console.error(e); }
    _acc -= STEP_MS; steps++;
  }
  lctx.setTransform(RS, 0, 0, RS, 0, 0); lctx.imageSmoothingEnabled = false;
  try { Game.draw(lctx); } catch (e) { console.error(e); }
  dctx.imageSmoothingEnabled = false;
  dctx.drawImage(LC, 0, 0, DC.width, DC.height);
  requestAnimationFrame(frame);
}

          if (this.ramT > 0) this.score(200, o.x, o.z, 'BOOM! +200'); else this.hitVan(9, o.x, o.z); } }
      else if (o.kind === 'walker') { o.t++; o.x -= this.speed * 0.9; o.z += o.vz; if (o.x < -40 || o.z < ROAD_TOP - 20 || o.z > ROAD_BOT + 20) o.alive = false;
        if (o.x > vx0 && o.x < vx1 && Math.abs(o.z - this.z) < 13) { o.alive = false; this.kills++; this.score(300, o.x, o.z, pickLine(['SPLAT! +300', '~SPIACCICATO! +300']));
          if (goreOn()) { bloodPool(o.x, o.z, 12, '#5a8a1a'); blood(o.x, o.z, 30, 14, 1, '#5a8a1a'); } else chipsAt(o.x, o.z, 30, 12, ['#efe9dc', '#c6bfae'], 3); Audio2.sfxPlay('splat'); } }
      else if (o.kind === 'bike') {
        // il motociclista si affianca al furgone e lo colpisce
        const side = o.z < this.z ? -1 : 1, tz = clamp(this.z + side * 22, ROAD_TOP + 4, ROAD_BOT - 4), tx = this.x + (o.vx > 0 ? -10 : 30);
        o.x += clamp(tx - o.x, -2.4, 2.4) + (o.flung ? 0 : 0); o.z = approach(o.z, tz, 0.7);
        if (o.flung) { o.x += o.fvx; o.z += o.fvz; o.y = (o.y || 0) + o.fvy; o.fvy -= 0.4; if (o.y < 0 || o.x > W + 80 || o.x < -80) { o.alive = false; if (goreOn()) bloodPool(o.x, clamp(o.z, ROAD_TOP, ROAD_BOT), 10, '#a8141e'); } continue; }
        if (--o.atkT <= 0 && Math.abs(o.x - this.x) < 70 && Math.abs(o.z - this.z) < 30) { o.atkT = randi(70, 120); this.hitVan(5, this.x, this.z); if (chance(0.5)) o.say = { txt: pickLine(PERSONAS[this.d.bikers] ? PERSONAS[this.d.bikers].taunt : ['AH AH!']), t: 70 }; }
        if (o.say && --o.say.t <= 0) o.say = null;
        // il furgone lo travolge se gli sterza addosso o lo sperona
        if (o.x > vx0 && o.x < vx1 && Math.abs(o.z - this.z) < (this.ramT > 0 ? 18 : 11)) { o.flung = true; o.fvx = 4 + rand(0, 2); o.fvz = sign(o.z - this.z || 1) * 1.2; o.fvy = 5; o.y = 1; this.kills++;
          this.score(500, o.x, o.z, pickLine(['INVESTITO! +500', '~VOLA, STRONZO! +500'])); Audio2.sfxPlay('hitHeavy'); G.shake(2, 8); if (goreOn()) blood(o.x, o.z, 30, 16, 1, '#a8141e'); }
      }
    }
    this.things = this.things.filter(o => o.alive);
    // fine della corsa
    if (this.hp <= 0 && !this.done) { this.done = 'rotto'; Audio2.sfxPlay('explode'); G.shake(5, 30); for (const p of this.players) p.score = Math.max(0, p.score - 1000); popText(pickLine(['IL FURGONE E\' ANDATO!', '~IL FURGONE E\' ANDATO A PUTTANE!']), this.x, this.z, 120, '#ff4d6d', 120); }
    if (this.dist >= this.d.len && !this.done) { this.done = 'arrivo'; Audio2.sfxPlay('oneup'); const bonus = this.hp * 50; this.score(bonus, this.x, this.z, 'ARRIVATI! +' + bonus); const p = this.players[0]; if (p) p.line('win', 1); }
    if (this.t % 600 === 300) { const p = pick(this.players); if (p) p.say(pickLine(['CHI GUIDA?', '~CHI HA SCOREGGIATO IN FURGONE?', '~FERMATI, DEVO PISCIARE!', 'SIAMO QUASI ARRIVATI?', '~CHE PUZZA DI PIEDI QUI DENTRO']), 100); }
    G.texts.forEach(t => t.t++); G.texts = G.texts.filter(t => t.t < t.life);
    for (const f of G.fx) { f.t++; f.x += f.vx - this.speed * 0.5; f.y = Math.max(0, f.y + f.vy); if (f.type === 'chip' || f.type === 'blood') f.vy -= 0.22; }
    G.fx = G.fx.filter(f => f.t < f.life);
    for (const dc of G.decals) dc.x -= this.speed; G.decals = G.decals.filter(dc => dc.x > -60);
  }
  draw(ctx) {
    const sc = this.dist;
    ctx.drawImage(this.sky, 0, 0, W, 150);
    const fx = -((sc * 0.15) % W); ctx.drawImage(this.far, fx, 0, W * 2, 150);
    // guardrail e lampioni
    ctx.fillStyle = '#2a2632'; ctx.fillRect(0, 138, W, 12); ctx.fillStyle = '#8a90a0'; ctx.fillRect(0, 140, W, 2); ctx.fillRect(0, 145, W, 1.5);
    for (let k = -((sc) % 48); k < W; k += 48) { ctx.fillStyle = '#5a5a66'; ctx.fillRect(k, 140, 2, 10); }
    for (let k = -((sc * 1.0) % 160); k < W; k += 160) { ctx.fillStyle = '#16121e'; ctx.fillRect(k, 60, 3, 80); ctx.fillRect(k, 60, 18, 3); ctx.fillStyle = this.d.theme === 'hell' ? '#ff5a3a' : '#fff2a8'; ctx.fillRect(k + 14, 63, 6, 2); }
    // strada
    ctx.fillStyle = this.d.theme === 'desert' ? '#4a3a34' : '#2a2633'; ctx.fillRect(0, 150, W, H - 150);
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 150, W, 3);
    for (const lz of [172, 194]) for (let k = -((sc * 1.0) % 60); k < W; k += 60) { ctx.fillStyle = '#c9a43a'; ctx.fillRect(k, lz, 30, 2); }
    ctx.fillStyle = '#e8e8ea'; ctx.fillRect(0, 218, W, 2);
    drawDecals(ctx, 0);
    // oggetti in ordine di profondità
    const list = this.things.map(o => [o.z, o]); list.push([this.z, this]);
    list.sort((a, b) => a[0] - b[0]);
    for (const [, o] of list) {
      if (o === this) { this.drawVan(ctx); continue; }
      if (o.kind === 'obst') { pixelShadow(ctx, o.x, o.z, 12, 3);
        if (o.sub === 'cono') { ctx.fillStyle = '#ff7a2a'; ctx.beginPath(); ctx.moveTo(o.x - 7, o.z); ctx.lineTo(o.x, o.z - 18); ctx.lineTo(o.x + 7, o.z); ctx.fill(); ctx.fillStyle = '#ffffff'; ctx.fillRect(o.x - 4, o.z - 9, 8, 2); }
        else if (o.sub === 'gomme') { for (let k = 0; k < 3; k++) { fdisc(ctx, o.x, o.z - 4 - k * 6, 7, '#18161e'); fdisc(ctx, o.x, o.z - 4 - k * 6, 3, '#3a3a46'); } }
        else blitHi(ctx, propSprite(o.sub === 'cassa' ? 'cassa' : 'bidone', 0), o.x - 13, o.z - 31); }
      else if (o.kind === 'walker') { const fr = o.anims.walkZ || o.anims.walk, f = fr[(o.t >> 3) % fr.length]; pixelShadow(ctx, o.x, o.z, 12, 3); drawSprite(ctx, getFrame(o.look, 'own', f.p, 'walkZ' + ((o.t >> 3) % fr.length)), o.x, o.z, -1); }
      else if (o.kind === 'bike') {
        const y = o.z - (o.y || 0), dir = 1;
        if (!o.flung) pixelShadow(ctx, o.x, o.z, 26, 4);
        blitHi(ctx, bikeSprite(o.bc), o.x - 38, y - 39);
        drawSprite(ctx, getFrame(o.look, 'own', RIDE_POSE, 'ride'), o.x - 6, y + 2, dir);
        if (o.say) queueBubble(o.say.txt, o.x, y - 96, '#ff4d6d');
      }
    }
    flushBubbles(ctx);
    drawTexts(ctx, 0);
    for (const f of G.fx) drawFxOne(ctx, f, 0);
    // HUD: giocatori, barra del furgone, distanza
    drawHud(ctx);
    const bw = 200, bx = (W - bw) / 2, by = 208;
    drawPanel(ctx, bx - 4, by - 11, bw + 8, 22, 'rgba(12,6,20,0.85)', '#3ec5ff');
    drawText(ctx, 'FURGONE DEL TOUR', bx, by - 9, '#3ec5ff', { outline: '#0a0610' });
    drawText(ctx, Math.max(0, Math.round((this.d.len - this.dist) / 10)) + ' M', bx + bw, by - 9, '#ffffff', { align: 'right' });
    drawLifeBar(ctx, bx, by + 1, bw, 6, this.hp / this.maxHp, hpColor(this.hp / this.maxHp));
    if (this.t < 150) { drawText(ctx, this.d.title, W / 2, 62, '#ffd23e', { align: 'center', scale: textWidth(this.d.title, 2) > W - 10 ? 1 : 2, outline: '#3a1a00' }); drawText(ctx, 'SU/GIU\' STERZA · COLPO SPERONA · AVANTI ACCELERA', W / 2, 84, '#ffffff', { align: 'center', outline: '#0a0610' }); }
    if (this.done) drawText(ctx, this.done === 'rotto' ? 'FURGONE DISTRUTTO!' : 'ARRIVATI!', W / 2, 90, this.done === 'rotto' ? '#ff4d6d' : '#62f08e', { align: 'center', scale: 3, outline: '#0a0610' });
  }
  drawVan(ctx) {
    const x = this.x, z = this.z, bump = (this.t >> 2) % 2 && this.speed > 3 ? 0.5 : 0, blink = this.hurtT > 0 && (this.t >> 2) % 2;
    pixelShadow(ctx, x, z, 84, 7);
    if (blink) ctx.globalAlpha = 0.55;
    blitHi(ctx, vanSprite(Math.floor(this.wheel) % 4), x - 85, z - 83 + bump);
    // la band ai finestrini
    const ps = this.players.slice(0, 4);
    ps.forEach((p, i) => { const cv = portrait(p.char), wx = i === 0 ? x + 46 : x - 70 + (i - 1) * 40; ctx.drawImage(cv, wx, z - 69 + bump, cv.width / RS * 0.72, cv.height / RS * 0.72); });
    drawText(ctx, 'THE ANABLES', x - 6, z - 33 + bump, '#ffd23e', { align: 'center', scale: 2, outline: '#3a0a14' });
    ctx.globalAlpha = 1;
    if (this.ramT > 0) for (let k = 0; k < 3; k++) addFx('streak', x + 70, z, 40 + k * 10, { life: 8, dir: 1, col: '#ff9b45' });
    if (this.t % 6 === 0) addFx('smoke', x - 88, z, 14, { life: 24, vx: -1 });
    for (const p of ps) if (p.bubble) queueBubble(p.bubble.txt, x - 10 + p.slot * 14, z - 88, p.color);
  }
}

SCENES.van = {
  enter(arg) { this.next = arg.next; G.projs = []; G.fx = []; G.texts = []; G.decals = []; G.enemies = []; G.bossRef = null; G.bossGroup = null; G.cam = { x: 0, max: 0, shake: 0, shakeT: 0 }; this.ride = new VanRide(arg.after); Audio2.play('van'); },
  update() {
    const r = this.ride; r.update();
    if (G.cam.shakeT > 0) G.cam.shakeT--; else G.cam.shake = 0;
    if (r.done && r.endT > 150) startLevel(this.next);
  },
  draw(ctx) {
    const sh = G.cam.shakeT > 0 ? G.cam.shake : 0;
    ctx.save(); if (sh) ctx.translate(Math.round(rand(-sh, sh)), Math.round(rand(-sh, sh) * 0.5));
    this.ride.draw(ctx); ctx.restore();
  },
};
// ============================================================
// COMPAGNO CPU per la partita in solitario (attivabile nelle opzioni)
// Produce lo stesso tipo di input di un giocatore umano.
// ============================================================
class CPUBrain {
  constructor(p) { this.p = p; const id = 'cpu' + p.slot; this.src = Input.sources[id] = Input._blank(); p.src = id; this.t = 0; this.atkT = 0; this.lane = 0; this.retreatT = 0; }
  think() {
    const p = this.p, s = this.src;
    this.t++;
    const want = { left: false, right: false, up: false, down: false, atk: false, jump: false, heavy: false, spec: false, start: false, back: false };
    const goTo = (x, z, tol = 4) => {
      if (x < p.x - tol) want.left = true; else if (x > p.x + tol) want.right = true;
      if (z < p.z - 2) want.up = true; else if (z > p.z + 2) want.down = true;
    };
    if (p.out) { if (this.t % 180 === 0) want.start = true; }
    else if (p.state === 'grabbedE') { want.atk = this.t % 4 < 2; want.left = this.t % 8 < 4; want.right = !want.left; }
    else if (p.state === 'grab') { want.atk = this.t % 14 === 0; if (p.knees >= 2) { if (p.facing > 0) want.right = true; else want.left = true; } }
    else {
      // pericoli: raggi del boss e piroetta
      const beam = G.projs.find(o => o.danger && o.dodgeR && Math.abs(o.x - p.x) < o.dodgeR && Math.abs(o.z - p.z) < 18);
      const boss = G.bossRef && G.bossRef.isBoss ? G.bossRef : null;
      const spinning = boss && (boss.state === 'spinTele' || boss.state === 'spin') && Math.abs(boss.z - p.z) < 18;
      const ko = G.players.find(o => o !== p && o.state === 'ko');
      const leader = G.players.find(o => o !== p && o.active && !o.out && !o.cpu) || p;
      const foes = G.enemies.filter(e => e.alive && !['dead', 'down', 'intro'].includes(e.state) && e.x > G.cam.x - 10 && e.x < G.cam.x + W + 10);
      const disc = G.projs.find(o => o.danger && !o.dodgeR && o.vx && Math.abs(o.z - p.z) < 12 && sign(p.x - o.x) === sign(o.vx) && Math.abs(o.x - p.x) < 160);
      // anti-blocco: se resta fermo a lungo con dei nemici in giro, cambia corsia e salta
      const hpSum = foes.reduce((a, e) => a + e.hp, 0);
      if (foes.length && hpSum === this.lastHpSum && Math.abs(p.x - (this.lastX ?? p.x)) < 3 && Math.abs(p.z - (this.lastZ ?? p.z)) < 3) this.stuckT = (this.stuckT || 0) + 1; else { this.stuckT = 0; this.lastX = p.x; this.lastZ = p.z; this.lastHpSum = hpSum; }
      if (this.stuckT > 360) { this.unstickT = 40; this.stuckT = 0; this.unstickZ = clamp(p.z + (p.z > (LANE_TOP + LANE_BOTTOM) / 2 ? -40 : 40), LANE_TOP, LANE_BOTTOM); }
      if (this.unstickT > 0) { this.unstickT--; goTo(p.x + (this.unstickT > 20 ? 30 : -30), this.unstickZ); if (this.unstickT === 30) want.jump = true; }
      else if (disc && !beam && !spinning) { goTo(p.x, clamp(p.z + (p.z > (LANE_TOP + LANE_BOTTOM) / 2 ? -30 : 30), LANE_TOP, LANE_BOTTOM)); }
      else if (beam || spinning) {
        const away = (beam ? beam.z : boss.z) < p.z ? 1 : -1;
        goTo(p.x, clamp(p.z + away * 34, LANE_TOP, LANE_BOTTOM));
      } else if (ko) {
        goTo(ko.x + 22, ko.z, 8);
        if (Math.abs(ko.x - p.x) < 34 && Math.abs(ko.z - p.z) < 14 && this.t % 10 === 0) want.atk = true;
      } else if (foes.length) {
        const e = foes.sort((a, b) => (Math.abs(a.x - p.x) + Math.abs(a.z - p.z) * 2) - (Math.abs(b.x - p.x) + Math.abs(b.z - p.z) * 2))[0];
        if (this.tgt !== e) { this.tgt = e; this.side = sign(p.x - e.x) || 1; }
        let side = this.side;
        const range = p.wpn ? WEAPONS[p.wpn.kind].cpuRange : (20 + p.S.reach * 2) * K;
        if (e.x + side * range < G.cam.x + 18 || e.x + side * range > G.cam.x + W - 18) side = this.side = -side;
        if (p.hp < p.maxHp * 0.25 && Math.abs(e.x - p.x) < 60 && this.retreatT <= 0 && chance(0.02)) this.retreatT = 50;
        if (this.retreatT > 0) { this.retreatT--; goTo(e.x + side * 140, clamp(e.z + 34 * side, LANE_TOP, LANE_BOTTOM)); }
        else {
          goTo(e.x + side * range, e.z, 3);
          const inRange = Math.abs(Math.abs(e.x - p.x) - range) < (p.wpn ? 24 : 14) && Math.abs(e.z - p.z) < 6;
          if (inRange) {
            // guarda il nemico e attacca a ritmo di combo
            if (e.x > p.x && p.facing < 0) want.right = true;
            if (e.x < p.x && p.facing > 0) want.left = true;
            if (p.wpn && WEAPONS[p.wpn.kind].hold === 'saw') want.atk = true;
            else {
              // segue il ritmo della combo del musicista: preme appena il colpo successivo si può concatenare
              const mv = p.state === 'attack' && p.move && !p.wpn ? p.move : null;
              const ready = mv ? p.mvT >= mv.fr[0] + mv.fr[1] - 1 : true;
              if (ready && ++this.atkT >= (mv ? 3 : 9)) { want.atk = true; this.atkT = 0; }
            }
            const near = foes.filter(o => Math.abs(o.x - p.x) < 90 && Math.abs(o.z - p.z) < 28).length;
            if (p.meter >= 100 && (near >= 2 || e.isBoss) && chance(0.05)) want.spec = true;
            else if (!p.wpn && chance(0.01)) want.heavy = true;
          }
        }
      } else {
        const item = G.pickups.find(it => it.t > 12 && Math.abs(it.x - p.x) < 210 && it.x > G.cam.x + 18 && it.x < G.cam.x + W - 18 && (it.isWeapon ? !p.wpn : (p.hp < p.maxHp * 0.8 || !it.def.heal)));
        if (item) {
          this.dbg = 'item ' + item.kind + '@' + Math.round(item.x) + ',' + Math.round(item.z); goTo(item.x, item.z, 2);
          if (item.isWeapon && Math.abs(item.x - p.x) < 16 && Math.abs(item.z - p.z) < 8 && this.t % 8 === 0) want.atk = true;
        }
        else if (leader === p) {
          // da solo: avanza quando la telecamera è libera, rompe gli oggetti vicini
          this.skipProps = this.skipProps || new Set();
          const prop = G.props.find(o => o.alive && !o.rolling && !this.skipProps.has(o) && Math.abs(o.x - p.x) < 90 && o.x > G.cam.x + 14 && o.x < G.cam.x + W - 14);
          if (prop) {
            this.dbg = 'prop ' + prop.kind + '@' + Math.round(prop.x);
            if (this.tgt !== prop) { this.tgt = prop; this.side = p.x < prop.x ? -1 : 1; this.engaged = false; this.propT = 0; this.propHits = prop.hits; }
            // se dopo un po' non riesce a romperlo (arma che non lo colpisce, compagno in mezzo...), lo lascia stare
            if (prop.hits !== this.propHits) { this.propHits = prop.hits; this.propT = 0; }
            if (++this.propT > 420) { this.skipProps.add(prop); this.tgt = null; }
            let sx = prop.x + this.side * 30;
            if (sx < G.cam.x + 18 || sx > G.cam.x + W - 18) { this.side = -this.side; sx = prop.x + this.side * 30; }
            const d = Math.abs(sx - p.x), dz = Math.abs(prop.z - p.z);
            const faceOk = sign(prop.x - p.x) === p.facing;
            if (dz > 5 || d > 14 || (!faceOk && d > 5)) goTo(sx, prop.z, 2);
            else if (!faceOk) { if (prop.x > p.x) want.right = true; else want.left = true; }
            else if (this.t % 12 === 0) want.atk = true;
          }
          else if (G.cam.max > G.cam.x + 0.2 || G.goT > 0 || (G.level && G.level.pendingZone !== undefined)) {
            this.dbg = 'advance'; want.right = true; if (Math.abs(p.z - 178) > 8) goTo(p.x + 60, 178); }
        } else {
          // segui il compagno umano
          const fx = leader.x - leader.facing * 52;
          if (Math.abs(fx - p.x) > 27 || Math.abs(leader.z + 16 - p.z) > 14) goTo(fx, clamp(leader.z + 16, LANE_TOP, LANE_BOTTOM), 10);
          if (G.goT > 0 && leader.x > p.x - 15) want.right = true;
        }
      }
    }
    // se vuole muoversi ma resta fermo a lungo (bloccato da qualcosa), cambia corsia per un attimo
    if (!p.out && (want.left || want.right || want.up || want.down) && ['walk', 'idle', 'run'].includes(p.state)) {
      if (Math.abs(p.x - (this.mvX ?? -999)) < 1.5 && Math.abs(p.z - (this.mvZ ?? -999)) < 1.5) this.mvT = (this.mvT || 0) + 1; else { this.mvT = 0; this.mvX = p.x; this.mvZ = p.z; }
      if (this.mvT > 180 && !(this.unstickT > 0)) { this.mvT = 0; this.unstickT = 40; this.unstickZ = clamp(p.z + (p.z > (LANE_TOP + LANE_BOTTOM) / 2 ? -40 : 40), LANE_TOP, LANE_BOTTOM); }
    }
    for (const a of ACTIONS) { s.prev[a] = s.held[a]; s.held[a] = want[a]; s.pressed[a] = want[a] && !s.prev[a]; }
  }
}

(function () {
  if (!document.getElementById('screen')) return; // pagine di test senza schermo
  const portraitCheck = () => document.body.classList.toggle('portrait', window.innerHeight > window.innerWidth * 1.05);
  window.addEventListener('resize', portraitCheck);
  portraitCheck();
  const _origResize = resize;
  resize = function () {
    portraitCheck();
    const stage = document.getElementById('stage');
    if (document.body.classList.contains('has-touch') && document.body.classList.contains('portrait')) {
      const w = document.body.clientWidth - 32;
      stage.style.height = Math.round(w * 9 / 16 + 16) + 'px';
    } else stage.style.height = '';
    _origResize();
  };
  const start = () => boot();
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start();
})();
